    function saveInitialBalance(e, chapterId) {
      e.preventDefault();
      const book = getActiveBook();
      const ch = book.chapters.find(c => c.id === chapterId);
      if (!ch) return;
      ch.initialBalance = Number((parseFloat(document.getElementById('directInitBalInput').value) || 0).toFixed(2));
      saveState();
      closeModal();
      renderAll();
      showToast('Saldo inicial actualizado');
    }

    function updateChapterConfig(e, chapterId) {
      e.preventDefault();
      const book = getActiveBook();
      const ch = book.chapters.find(c => c.id === chapterId);
      if (!ch) return;
      ch.name = document.getElementById('cfgChName').value.trim();
      ch.quota = Number((parseFloat(document.getElementById('cfgChQuota').value) || 0).toFixed(2));
      ch.initialBalance = Number((parseFloat(document.getElementById('cfgChInit').value) || 0).toFixed(2));
      saveState();
      closeModal();
      renderAll();
      showToast('Capítulo actualizado');
    }

    function openNewChapterModal() {
      openModal(`
        <div class="px-5 pt-4 pb-3 border-b border-cream-200 flex items-center justify-between bg-white">
          <h3 class="font-extrabold text-base text-stoneInk-900">Nuevo Capítulo</h3>
          <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-cream-200 flex items-center justify-center text-stoneInk-700">
            <i class="ph-bold ph-x"></i>
          </button>
        </div>

        <form onsubmit="createNewChapter(event)" class="p-5 space-y-4">
          <div>
            <label class="block text-xs font-bold text-stoneInk-700 mb-1">Nombre del capítulo</label>
            <input type="text" id="newChTitle" required placeholder="Ej. Supermercado, Luz, Deporte..."
              class="w-full bg-white border border-cream-300 rounded-xl px-3.5 py-2.5 text-sm font-bold" />
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-bold text-stoneInk-700 mb-1">Saldo Inicial (€)</label>
              <input type="number" step="0.01" id="newChInitVal" value="0" required
                class="w-full bg-white border border-cream-300 rounded-xl px-3.5 py-2.5 font-mono text-sm font-bold" />
            </div>
            <div>
              <label class="block text-xs font-bold text-stoneInk-700 mb-1">Cuota Mensual (€)</label>
              <input type="number" step="0.01" id="newChQuotaVal" value="50" required
                class="w-full bg-white border border-cream-300 rounded-xl px-3.5 py-2.5 font-mono text-sm font-bold" />
            </div>
          </div>
          <button type="submit" class="w-full py-3.5 rounded-2xl bg-emeraldPro-700 text-white font-extrabold text-sm">
            Crear Capítulo
          </button>
        </form>
      `);
    }

    function createNewChapter(e) {
      e.preventDefault();
      const book = getActiveBook();
      const name = document.getElementById('newChTitle').value.trim();
      if (!name) return;

      book.chapters.push({
        id: 'ch_' + Date.now(),
        name,
        initialBalance: Number((parseFloat(document.getElementById('newChInitVal').value) || 0).toFixed(2)),
        quota: Number((parseFloat(document.getElementById('newChQuotaVal').value) || 0).toFixed(2)),
        closed: false,
        closedDate: null,
        closedMonth: null
      });
      saveState();
      closeModal();
      renderAll();
      showToast(`Capítulo "${name}" creado`);
    }

    // --- F. GESTOR DE BLOQUES (CREAR / BORRAR BLOQUES + CREAR AÑOS) ---
    function openWorkspaceModal() {
      const active = getActiveBook();
      const workspaces = getWorkspaces();
      const canDeleteBlock = workspaces.length > 1;

      const blocksGridHtml = workspaces.map(ws => {
        const wsBooks = getBooksByCategory(ws.id);
        const isActive = active.category === ws.id;
        return `
          <div class="relative rounded-2xl border-2 transition-all ${
            isActive
              ? `${getWorkspaceBorderClass(ws.color)} bg-white shadow-sm`
              : 'border-cream-300 bg-cream-100 hover:bg-white'
          }">
            <button type="button" onclick="switchCategory('${ws.id}')" class="w-full p-3.5 text-left">
              <div class="w-9 h-9 rounded-xl ${getWorkspaceBgClass(ws.color)} text-white flex items-center justify-center mb-2">
                <i class="ph-bold ${ws.icon} text-lg"></i>
              </div>
              <p class="font-extrabold text-sm text-stoneInk-900 truncate pr-6">${esc(ws.name)}</p>
              <p class="text-[11px] text-stoneInk-500 mt-0.5">${formatYearsSummary(wsBooks)}</p>
            </button>

            ${canDeleteBlock ? `
              <button type="button" onclick="confirmDeleteWorkspace('${ws.id}')" title="Eliminar bloque"
                class="absolute top-2.5 right-2.5 w-7 h-7 rounded-lg bg-cream-200/80 hover:bg-rose-100 text-stoneInk-500 hover:text-rose-600 flex items-center justify-center transition-colors">
                <i class="ph-bold ph-trash text-xs"></i>
              </button>
            ` : ''}
          </div>
        `;
      }).join('');

      openModal(`
        <div class="px-5 pt-4 pb-3 border-b border-cream-200 flex items-center justify-between bg-white">
          <h3 class="font-extrabold text-base text-stoneInk-900">Bloques y Años</h3>
          <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-cream-200 flex items-center justify-center text-stoneInk-700">
            <i class="ph-bold ph-x"></i>
          </button>
        </div>

        <div class="p-5 overflow-y-auto space-y-4">
          <div class="grid grid-cols-2 gap-3">
            ${blocksGridHtml}
          </div>

          <!-- Crear nuevo bloque -->
          <form onsubmit="createNewWorkspace(event)" class="bg-white border border-cream-300 rounded-2xl p-4 space-y-3">
            <p class="text-xs font-extrabold text-stoneInk-900 flex items-center gap-1.5">
              <i class="ph-bold ph-folder-simple-plus text-terra-600 text-base"></i>
              <span>Crear nuevo bloque</span>
            </p>
            <div class="grid grid-cols-12 gap-2">
              <div class="col-span-7">
                <input type="text" id="newBlockNameInput" required placeholder="Ej. Furgoneta, Ahorro, Viajes..."
                  class="w-full bg-cream-100 border border-cream-300 rounded-xl px-3 py-2 text-xs font-bold text-stoneInk-900 focus:outline-none" />
              </div>
              <div class="col-span-5">
                <select id="newBlockPresetSelect"
                  class="w-full bg-cream-100 border border-cream-300 rounded-xl px-2.5 py-2 text-xs font-bold text-stoneInk-800 focus:outline-none">
                  ${WORKSPACE_PRESETS.map((p, idx) => `
                    <option value="${idx}">${p.label}</option>
                  `).join('')}
                </select>
              </div>
            </div>
            <button type="submit" class="w-full py-2.5 rounded-xl bg-emeraldPro-700 hover:bg-emeraldPro-600 text-white text-xs font-extrabold">
              + Añadir Bloque
            </button>
          </form>

          <!-- Crear nuevo año en un bloque existente -->
          <form onsubmit="createNewYearBook(event)" class="bg-cream-200/80 border border-cream-300 rounded-2xl p-4 space-y-3">
            <p class="text-xs font-extrabold text-stoneInk-900 flex items-center gap-1.5">
              <i class="ph-bold ph-calendar-plus text-emeraldPro-700 text-base"></i>
              <span>Crear nuevo año</span>
            </p>

            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-[10px] font-bold text-stoneInk-600 mb-1">Bloque destino</label>
                <select id="newYearCategory" onchange="refreshCopySourceOptions()"
                  class="w-full bg-white border border-cream-300 rounded-xl px-3 py-2 text-xs font-bold">
                  ${workspaces.map(w => `
                    <option value="${w.id}" ${active.category === w.id ? 'selected' : ''}>${esc(w.name)}</option>
                  `).join('')}
                </select>
              </div>
              <div>
                <label class="block text-[10px] font-bold text-stoneInk-600 mb-1">Año</label>
                <input type="number" id="newYearNumber" value="${active.year + 1}" required
                  class="w-full bg-white border border-cream-300 rounded-xl px-3 py-2 font-mono text-xs font-bold" />
              </div>
            </div>

            <div>
              <label class="block text-[10px] font-bold text-stoneInk-600 mb-1">Copiar capítulos y saldos finales de:</label>
              <select id="copyFromBookSelect" onchange="updateCopyPreview()"
                class="w-full bg-white border border-cream-300 rounded-xl px-3 py-2 text-xs font-bold text-stoneInk-900">
              </select>
            </div>

            <div id="copyPreviewBox" class="bg-white/90 rounded-xl p-2.5 text-[11px] text-stoneInk-600 max-h-28 overflow-y-auto space-y-1"></div>

            <button type="submit" class="w-full py-3 rounded-xl bg-stoneInk-900 text-white text-xs font-extrabold">
              + Crear Año
            </button>
          </form>
        </div>
      `);

      refreshCopySourceOptions();
    }

    function createNewWorkspace(e) {
      e.preventDefault();
      const name = document.getElementById('newBlockNameInput').value.trim();
      if (!name) return;

      const presetIdx = parseInt(document.getElementById('newBlockPresetSelect').value, 10) || 0;
      const preset = WORKSPACE_PRESETS[presetIdx] || WORKSPACE_PRESETS[0];

      const slug = name
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z0-9]+/g, '_')
        .replace(/^_|_$/g, '') || 'bloque';

      const blockId = `${slug}_${Date.now()}`;
      const newBookId = `${blockId}_${CURRENT_REAL_YEAR}`;

      state.workspaces.push({
        id: blockId,
        name,
        icon: preset.icon,
        color: preset.color
      });

      state.books.push({
        id: newBookId,
        category: blockId,
        year: CURRENT_REAL_YEAR,
        chapters: [],
        transactions: []
      });

      state.activeCategory = blockId;
      state.activeBookId = newBookId;
      chronoFilter.chapterId = 'all';
      saveState();
      closeModal();
      renderAll();
      showToast(`Bloque "${name}" creado`);
    }

    function confirmDeleteWorkspace(wsId) {
      const workspaces = getWorkspaces();
      if (workspaces.length <= 1) {
        showToast('Debe quedar al menos un bloque activo', 'error');
        return;
      }
      const ws = getWorkspaceInfo(wsId);
      const wsBooks = getBooksByCategory(wsId);

      openModal(`
        <div class="px-5 pt-4 pb-3 border-b border-cream-200 flex items-center justify-between bg-white">
          <h3 class="font-extrabold text-base text-rose-700">Eliminar bloque</h3>
          <button onclick="openWorkspaceModal()" class="w-8 h-8 rounded-full bg-cream-200 flex items-center justify-center text-stoneInk-700">
            <i class="ph-bold ph-x"></i>
          </button>
        </div>
        <div class="p-5 space-y-4">
          <p class="text-xs text-stoneInk-700 leading-relaxed">
            ¿Seguro que quieres eliminar el bloque <strong>"${esc(ws.name)}"</strong> y todos sus años (${formatYearsSummary(wsBooks)})? Esta acción no se puede deshacer.
          </p>
          <div class="flex gap-2">
            <button type="button" onclick="openWorkspaceModal()"
              class="flex-1 py-3 rounded-2xl bg-cream-200 text-stoneInk-800 font-extrabold text-xs">
              Cancelar
            </button>
            <button type="button" onclick="executeDeleteWorkspace('${wsId}')"
              class="flex-1 py-3 rounded-2xl bg-rose-600 hover:bg-rose-700 text-white font-extrabold text-xs">
              Eliminar bloque
            </button>
          </div>
        </div>
      `);
    }

    function executeDeleteWorkspace(wsId) {
      const ws = getWorkspaceInfo(wsId);
      state.workspaces = getWorkspaces().filter(w => w.id !== wsId);
      state.books = state.books.filter(b => b.category !== wsId);

      if (state.activeCategory === wsId) {
        const nextWs = state.workspaces[0];
        state.activeCategory = nextWs.id;
        const nextBooks = getBooksByCategory(nextWs.id);
        state.activeBookId = nextBooks[0]?.id || '';
      }

      chronoFilter.chapterId = 'all';
      saveState();
      closeModal();
      renderAll();
      showToast(`Bloque "${ws.name}" eliminado`);
    }

    function refreshCopySourceOptions() {
      const selectedCat = document.getElementById('newYearCategory').value;
      const ws = getWorkspaceInfo(selectedCat);
      const catBooks = getBooksByCategory(selectedCat);
      const selectEl = document.getElementById('copyFromBookSelect');
      const yearInput = document.getElementById('newYearNumber');

      if (catBooks.length > 0) {
        yearInput.value = catBooks[0].year + 1;
      }

      selectEl.innerHTML = catBooks.map((b, idx) => `
        <option value="${b.id}" ${idx === 0 ? 'selected' : ''}>
          ${esc(ws.name)} · ${b.year} (${b.chapters.filter(c => !c.closed).length} cap. activos)
        </option>
      `).join('') + `<option value="blank">Empezar vacío (0 capítulos)</option>`;

      updateCopyPreview();
    }

    function switchCategory(cat) {
      state.activeCategory = cat;
      const list = getBooksByCategory(cat);
      if (list.length > 0) {
        state.activeBookId = list[0].id;
      }
      chronoFilter.chapterId = 'all';
      saveState();
      closeModal();
      renderAll();
    }

    function updateCopyPreview() {
      const srcId = document.getElementById('copyFromBookSelect').value;
      const box = document.getElementById('copyPreviewBox');
      if (srcId === 'blank') {
        box.innerHTML = `<span class="text-stoneInk-500">Se creará un libro vacío listo para añadir capítulos.</span>`;
        return;
      }
      const srcBook = state.books.find(b => b.id === srcId);
      if (!srcBook) return;
      const { chapters } = analyzeBook(srcBook, 11);
      const activeChapters = chapters.filter(c => !c.closed);
      if (activeChapters.length === 0) {
        box.innerHTML = `<span class="text-stoneInk-500">El libro seleccionado aún no tiene capítulos activos.</span>`;
        return;
      }
      box.innerHTML = `
        <p class="font-bold text-stoneInk-800 mb-1">Capítulos activos y saldos finales que heredará:</p>
        ${activeChapters.map(c => `
          <div class="flex justify-between font-mono text-[11px]">
            <span class="font-sans text-stoneInk-700">${esc(c.name)} (cuota ${fmtEur(c.quota)})</span>
            <strong class="${c.annualEndBalance < 0 ? 'text-terra-600' : 'text-emeraldPro-700'}">${fmtEur(c.annualEndBalance)}</strong>
          </div>
        `).join('')}
      `;
    }

    function createNewYearBook(e) {
      e.preventDefault();
      const cat = document.getElementById('newYearCategory').value;
      const ws = getWorkspaceInfo(cat);
      const year = parseInt(document.getElementById('newYearNumber').value, 10) || (CURRENT_REAL_YEAR + 1);
      const srcId = document.getElementById('copyFromBookSelect').value;

      const exists = state.books.find(b => b.category === cat && b.year === year);
      if (exists) {
        showToast(`Ya existe ${ws.name} ${year}`, 'error');
        return;
      }

      let chapters = [];
      if (srcId !== 'blank') {
        const srcBook = state.books.find(b => b.id === srcId && b.category === cat);
        if (srcBook) {
          const { chapters: analyzed } = analyzeBook(srcBook, 11);
          chapters = analyzed
            .filter(c => !c.closed)
            .map((c, idx) => ({
              id: `ch_${cat}_${year}_${Date.now()}_${idx}`,
              name: c.name,
              initialBalance: c.annualEndBalance,
              quota: c.quota
            }));
        }
      }

      const newId = `${cat}_${year}_${Date.now()}`;
      state.books.push({
        id: newId,
        category: cat,
        year,
        chapters,
        transactions: []
      });
      state.activeCategory = cat;
      state.activeBookId = newId;
      saveState();
      closeModal();
      renderAll();
      showToast(`Creado ${ws.name} ${year}`);
    }

    // --- G. AJUSTES, COPIA DE SEGURIDAD Y RESTAURACIÓN ---
    function openSettingsModal() {
      openModal(`
        <div class="px-5 pt-4 pb-3 border-b border-cream-200 flex items-center justify-between bg-white">
          <h3 class="font-extrabold text-base text-stoneInk-900">Ajustes y Copia de Seguridad</h3>
          <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-cream-200 flex items-center justify-center text-stoneInk-700">
            <i class="ph-bold ph-x"></i>
          </button>
        </div>

        <div class="p-5 overflow-y-auto space-y-4">
          <div class="bg-emeraldPro-50 border border-emeraldPro-700/20 rounded-2xl p-3.5">
            <p class="text-xs font-extrabold text-emeraldPro-700 mb-1 flex items-center gap-1.5">
              <i class="ph-bold ph-device-mobile text-base"></i>
              <span>Instalar en tu móvil (PWA)</span>
            </p>
            <p class="text-xs text-stoneInk-700 leading-relaxed">
              <strong>iPhone (Safari):</strong> Pulsa <em>Compartir</em> y elige <strong>"Añadir a pantalla de inicio"</strong>.<br/>
              <strong>Android (Chrome):</strong> Pulsa el menú <em>⋮</em> y elige <strong>"Instalar aplicación"</strong>.
            </p>
          </div>

          <div class="space-y-2">
            <button onclick="exportBookCSV()"
              class="w-full py-3 px-4 bg-white hover:bg-cream-50 border border-cream-300 rounded-2xl flex items-center justify-between text-xs font-extrabold text-stoneInk-900">
              <span class="flex items-center gap-2">
                <i class="ph-bold ph-file-xls text-lg text-emeraldPro-700"></i>
                Exportar año actual a Excel (CSV)
              </span>
              <i class="ph-bold ph-download-simple"></i>
            </button>

            <button onclick="exportFullJSON()"
              class="w-full py-3 px-4 bg-white hover:bg-cream-50 border border-cream-300 rounded-2xl flex items-center justify-between text-xs font-extrabold text-stoneInk-900">
              <span class="flex items-center gap-2">
                <i class="ph-bold ph-floppy-disk text-lg text-sky-700"></i>
                Descargar Copia de Seguridad completa (JSON)
              </span>
              <i class="ph-bold ph-download-simple"></i>
            </button>

            <label class="w-full py-3 px-4 bg-white hover:bg-cream-50 border border-dashed border-stoneInk-400 rounded-2xl flex items-center justify-center gap-2 text-xs font-extrabold text-stoneInk-700 cursor-pointer">
              <i class="ph-bold ph-upload-simple text-base"></i>
              <span>Restaurar copia desde JSON</span>
              <input type="file" accept=".json" onchange="importFullJSON(event)" class="hidden" />
            </label>
          </div>

          <div class="pt-2 border-t border-cream-200">
            <button onclick="restoreExcelDefault()"
              class="w-full py-2.5 text-xs font-extrabold text-terra-600 hover:bg-terra-50 rounded-xl transition-colors">
              Restaurar valores de fábrica
            </button>
          </div>
        </div>
      `);
    }

    function exportBookCSV() {
      const book = getActiveBook();
      const ws = getWorkspaceInfo(book.category);
      const chMap = Object.fromEntries(book.chapters.map(c => [c.id, c.name]));
      const rows = [['Bloque', 'Año', 'Fecha', 'Mes', 'Capitulo', 'Tipo', 'Importe', 'Concepto', 'Nota']];

      book.transactions.slice().sort((a, b) => (a.date || '').localeCompare(b.date || '')).forEach(t => {
        rows.push([
          `"${ws.name.replace(/"/g, '""')}"`,
          book.year,
          t.date,
          MONTHS_FULL[getTxMonth(t)],
          `"${(chMap[t.chapterId] || '').replace(/"/g, '""')}"`,
          t.transferId ? 'Traspaso' : (t.type === 'income' ? 'Ingreso' : 'Gasto'),
          formatSpanishNumber(t.amount),
          `"${(t.concept || '').replace(/"/g, '""')}"`,
          `"${(t.note || '').replace(/"/g, '""')}"`
        ]);
      });

      const csv = '\uFEFF' + rows.map(r => r.join(';')).join('\n');
      triggerDownload(csv, `${ws.name}_${book.year}.csv`, 'text/csv;charset=utf-8;');
      showToast('CSV descargado');
    }

    function exportFullJSON() {
      triggerDownload(JSON.stringify(state, null, 2), `MisSobres_Backup_${new Date().toISOString().slice(0, 10)}.json`, 'application/json');
      showToast('Copia JSON descargada');
    }

    function importFullJSON(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        try {
          const parsed = JSON.parse(ev.target.result);
          if (parsed && Array.isArray(parsed.books)) {
            state = ensureWorkspacesIntegrity(parsed);
            saveState();
            closeModal();
            renderAll();
            showToast('Copia restaurada');
          } else {
            showToast('Archivo JSON inválido', 'error');
          }
        } catch {
          showToast('Error al leer JSON', 'error');
        }
      };
      reader.readAsText(file);
    }

    function restoreExcelDefault() {
      state = buildInitialState();
      saveState();
      closeModal();
      renderAll();
      showToast('Valores de fábrica restaurados');
    }

    function triggerDownload(content, filename, mime) {
      const blob = new Blob([content], { type: mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // =========================================================================
    // 9. UTILIDADES UI
    // =========================================================================
    function showToast(msg, type = 'ok') {
      const box = document.getElementById('toastBox');
      const el = document.createElement('div');
      el.className = `px-4 py-2.5 rounded-2xl shadow-lg text-xs font-extrabold flex items-center gap-2 animate-fade ${
        type === 'error' ? 'bg-terra-600 text-white' : 'bg-stoneInk-900 text-white'
      }`;
      el.innerHTML = `<i class="ph-bold ${type === 'error' ? 'ph-warning-circle' : 'ph-check-circle'} text-base"></i><span>${esc(msg)}</span>`;
      box.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transition = 'opacity 0.2s';
        setTimeout(() => el.remove(), 220);
      }, 2400);
    }

    function esc(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    window.addEventListener('DOMContentLoaded', () => {
      initChronoListeners();
      renderAll();
    });
  </script>
