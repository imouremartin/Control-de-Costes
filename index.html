<!DOCTYPE html>
<html lang="es">
<head>

  <meta name="apple-mobile-web-app-title" content="Mis Sobres" />

  <!-- Tailwind CSS -->

  <!-- Tipografías -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Iconos Phosphor -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <!-- Configuración PWA -->
  <script>
    (function initPWA() {
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
        <rect width="512" height="512" rx="116" fill="#0F766E"/>
        <rect x="76" y="136" width="360" height="240" rx="36" fill="#F8F6F1"/>
        <path d="M76 176 L256 286 L436 176" fill="none" stroke="#0F766E" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="386" cy="336" r="52" fill="#C2410C"/>
        <text x="386" y="354" font-family="sans-serif" font-weight="800" font-size="54" fill="#FFFFFF" text-anchor="middle">€</text>
      </svg>`;
      const iconUrl = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));

      const linkIcon = document.createElement('link');
      linkIcon.rel = 'icon';
      linkIcon.type = 'image/svg+xml';
      linkIcon.href = iconUrl;
      document.head.appendChild(linkIcon);

      const appleIcon = document.createElement('link');
      appleIcon.rel = 'apple-touch-icon';
      appleIcon.href = iconUrl;
      document.head.appendChild(appleIcon);

      const manifest = {
        name: 'Mis Sobres · Control de Cuentas',
        short_name: 'Mis Sobres',
        description: 'Gestión de presupuestos por capítulos y años',
        start_url: '.',
        display: 'standalone',
        background_color: '#F8F6F1',
        theme_color: '#F8F6F1',
        orientation: 'portrait',
        icons: [
          { src: iconUrl, sizes: '192x192', type: 'image/svg+xml', purpose: 'any maskable' },
          { src: iconUrl, sizes: '512x512', type: 'image/svg+xml', purpose: 'any maskable' }
        ]
      };
      const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
      const mLink = document.createElement('link');
      mLink.rel = 'manifest';
      mLink.href = URL.createObjectURL(blob);
      document.head.appendChild(mLink);
    })();
  </script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],

              700: '#44403C',
              500: '#78716C',
              400: '#A8A29E',
            },
            emeraldPro: {
              700: '#0F766E',
              600: '#0D9488',
              100: '#CCFBF1',
              50: '#F0FDFA',
            },
            terra: {
              600: '#C2410C',

  </script>

  <style>
    body {
      background-color: #F8F6F1;
      color: #1C1917;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
    }

    /* Tabla Anual: columnas fijas 100% opacas y con z-index alto */

    .sticky-head-1 {

    .sticky-head-2 {

  <div id="app" class="max-w-4xl mx-auto min-h-screen flex flex-col">

    <!-- CABECERA SUPERIOR LIMPIA: Bloque + Año + Ajustes -->

      <div class="flex items-center justify-between gap-2">
        <!-- Selector jerárquico Bloque + Año -->

          <div class="h-7 w-[1px] bg-cream-300 shrink-0"></div>

          <!-- Desplegable de Año -->

            <select id="headerYearSelect" onchange="selectYearInCategory(this.value)"

  <!-- MODAL GENÉRICO -->

  <!-- TOAST -->
  <div id="toastBox" class="fixed top-20 inset-x-4 z-50 flex flex-col items-center pointer-events-none gap-2"></div>

  <script>
    // =========================================================================
    // 1. CONFIGURACIÓN INICIAL (SIN DATOS PRIVADOS EN EL CÓDIGO PÚBLICO)
    // =========================================================================
    const STORAGE_KEY = 'mis_sobres_db_v8';
    const MONTHS_SHORT = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
    const MONTHS_FULL = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];

    const DEFAULT_WORKSPACES = [
      { id: 'personal', name: 'Personal', icon: 'ph-user', color: 'emerald' },
      { id: 'hogar', name: 'Hogar', icon: 'ph-house-line', color: 'terra' }
    ];

    const WORKSPACE_PRESETS = [
      { icon: 'ph-user', color: 'emerald', label: 'Personal' },
      { icon: 'ph-house-line', color: 'terra', label: 'Hogar' },
      { icon: 'ph-car', color: 'sky', label: 'Vehículo' },
      { icon: 'ph-airplane-tilt', color: 'indigo', label: 'Viajes' },
      { icon: 'ph-briefcase', color: 'amber', label: 'Trabajo' },
      { icon: 'ph-piggy-bank', color: 'violet', label: 'Ahorro' },
      { icon: 'ph-folder-open', color: 'stone', label: 'Otro' }
    ];

    // Datasets vacíos por defecto (los datos reales se cargan localmente vía JSON)
    const PERSONAL_2019_2026 = {
      "2026": { "chapters": [], "transactions": [] }
    };

    const HOGAR_2022_2026 = {
      "2026": { "chapters": [], "transactions": [] }
    };

    // =========================================================================
    // 2. GESTIÓN DE ESTADO (BLOQUES DINÁMICOS + AÑOS + ORDENACIÓN)
    // =========================================================================
    const NOW = new Date();
    const CURRENT_REAL_YEAR = NOW.getFullYear();
    const CURRENT_REAL_MONTH = NOW.getMonth(); // 0..11

    let state = loadState();
    let currentView = 'chapters'; // 'chapters' | 'table' | 'chrono' | 'charts'
    let selectedMonth = CURRENT_REAL_MONTH; // Arranca en el mes real actual
    let chapterSortMode = 'az'; // 'az' | 'za' | 'bal_asc' | 'bal_desc'
    let chartDonutMode = 'year_expense'; // 'year_expense' | 'month_expense'
    let chartDonutMonth = CURRENT_REAL_MONTH;
    let chartInspectMonth = null;
    let chronoFilter = {
      search: '',
      chapterId: 'all',
      month: 'all',
      type: 'all'
    };

    const CHART_PALETTE = [
      '#0F766E', '#EA580C', '#2563EB', '#DB2777', '#CA8A04',
      '#7C3AED', '#16A34A', '#DC2626', '#0891B2', '#9333EA',
      '#4F46E5', '#65A30D', '#E11D48', '#0284C7', '#D97706'
    ];

    function buildInitialState() {
      const pYears = Object.keys(PERSONAL_2019_2026).sort((a, b) => Number(b) - Number(a));
      const personalBooks = pYears.map(yr => ({
        id: `personal_${yr}`,
        category: 'personal',
        year: Number(yr),
        chapters: (PERSONAL_2019_2026[yr].chapters || []).map(c => ({ ...c })),
        transactions: (PERSONAL_2019_2026[yr].transactions || []).map(t => ({ ...t }))
      }));

      const hYears = Object.keys(HOGAR_2022_2026).sort((a, b) => Number(b) - Number(a));
      const hogarBooks = hYears.map(yr => ({
        id: `hogar_${yr}`,
        category: 'hogar',
        year: Number(yr),
        chapters: (HOGAR_2022_2026[yr].chapters || []).map(c => ({ ...c })),
        transactions: (HOGAR_2022_2026[yr].transactions || []).map(t => ({ ...t }))
      }));

      return {
        workspaces: DEFAULT_WORKSPACES.map(w => ({ ...w })),
        activeCategory: 'personal',
        activeBookId: personalBooks[0]?.id || 'personal_2026',
        books: [...personalBooks, ...hogarBooks]
      };
    }

    function ensureWorkspacesIntegrity(st) {
      if (!Array.isArray(st.workspaces) || st.workspaces.length === 0) {
        st.workspaces = DEFAULT_WORKSPACES.map(w => ({ ...w }));
      }
      const existingIds = new Set(st.workspaces.map(w => w.id));
      (st.books || []).forEach(b => {
        if (b.category && !existingIds.has(b.category)) {
          existingIds.add(b.category);
          const preset = DEFAULT_WORKSPACES.find(d => d.id === b.category);
          st.workspaces.push(preset
            ? { ...preset }
            : {
                id: b.category,
                name: b.category.charAt(0).toUpperCase() + b.category.slice(1),
                icon: 'ph-folder',
                color: 'sky'
              }
          );
        }
      });
      return st;
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.books) && parsed.books.length > 0) {
            return ensureWorkspacesIntegrity(parsed);
          }
        }
      } catch (e) {
        console.error('Error leyendo localStorage:', e);
      }
      const fresh = buildInitialState();
      saveState(fresh);
      return fresh;
    }

    function saveState(target = state) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(target));
      } catch (e) {
        console.error('Error guardando estado:', e);
      }
    }

    function getWorkspaces() {
      ensureWorkspacesIntegrity(state);
      return state.workspaces;
    }

    function getWorkspaceInfo(catId) {
      return getWorkspaces().find(w => w.id === catId) || {
        id: catId,
        name: catId === 'personal' ? 'Personal' : (catId === 'hogar' ? 'Hogar' : catId),
        icon: catId === 'hogar' ? 'ph-house-line' : 'ph-user',
        color: catId === 'hogar' ? 'terra' : 'emerald'
      };
    }

    function getWorkspaceBgClass(color) {
      const map = {
        emerald: 'bg-emeraldPro-700',
        terra: 'bg-terra-600',
        sky: 'bg-sky-700',
        indigo: 'bg-indigo-700',
        amber: 'bg-amber-600',
        violet: 'bg-violet-700',
        stone: 'bg-stoneInk-700'
      };
      return map[color] || 'bg-emeraldPro-700';
    }

    function getWorkspaceBorderClass(color) {
      const map = {
        emerald: 'border-emeraldPro-700',
        terra: 'border-terra-600',
        sky: 'border-sky-700',
        indigo: 'border-indigo-700',
        amber: 'border-amber-600',
        violet: 'border-violet-700',
        stone: 'border-stoneInk-700'
      };
      return map[color] || 'border-emeraldPro-700';
    }

    function getBooksByCategory(cat) {
      return state.books
        .filter(b => b.category === cat)
        .sort((a, b) => b.year - a.year);
    }

    function getActiveBook() {
      let b = state.books.find(x => x.id === state.activeBookId);
      if (!b) {
        const list = getBooksByCategory(state.activeCategory);
        b = list[0] || state.books[0];
        if (!b) {
          const ws = getWorkspaces()[0] || DEFAULT_WORKSPACES[0];
          b = {
            id: `${ws.id}_${CURRENT_REAL_YEAR}`,
            category: ws.id,
            year: CURRENT_REAL_YEAR,
            chapters: [],
            transactions: []
          };
          state.books.push(b);
        }
        state.activeBookId = b.id;
        state.activeCategory = b.category;
      }
      return b;
    }

    function getSortedChapters(chapters) {
      return [...chapters].sort((a, b) => {
        const aClosed = Boolean(a.closed);
        const bClosed = Boolean(b.closed);
        if (aClosed !== bClosed) return aClosed ? 1 : -1;
        return (a.name || '').localeCompare(b.name || '', 'es', { sensitivity: 'base' });
      });
    }

    function formatYearsSummary(books) {
      if (!books || books.length === 0) return '0 años';
      const sortedAsc = [...books].sort((a, b) => a.year - b.year);
      if (sortedAsc.length === 1) {
        return `1 año (${sortedAsc[0].year})`;
      }
      return `${sortedAsc.length} años (${sortedAsc[0].year}–${sortedAsc[sortedAsc.length - 1].year})`;
    }

    /**
     * Devuelve true si el libro/mes seleccionado es el mes real en curso o cualquier mes/año futuro.
     */
    function isCurrentOrFutureMonth(bookYear, monthIdx) {
      const y = Number(bookYear);
      const m = Number(monthIdx);
      if (y > CURRENT_REAL_YEAR) return true;
      if (y < CURRENT_REAL_YEAR) return false;
      return m >= CURRENT_REAL_MONTH;
    }

    // =========================================================================
    // 3. FORMATEO NUMÉRICO CON SEPARADOR DE MILES (PUNTO) Y CÁLCULOS
    // =========================================================================
    function formatSpanishNumber(num) {
      const val = Number(num) || 0;
      const fixed = val.toFixed(2);
      const [intPart, decPart] = fixed.split('.');
      const sign = intPart.startsWith('-') ? '-' : '';
      const digits = intPart.replace('-', '').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
      return `${sign}${digits},${decPart}`;
    }

    function fmtEur(num) {
      return formatSpanishNumber(num) + ' €';
    }

    function fmtCell(num) {
      const val = Number(num) || 0;
      if (Math.abs(val) < 0.005) return '—';
      return formatSpanishNumber(val);
    }

    function getTxMonth(tx) {
      if (typeof tx.month === 'number' && tx.month >= 0 && tx.month <= 11) {
        return tx.month;
      }
      if (tx.date && tx.date.length >= 7) {
        const m = parseInt(tx.date.split('-')[1], 10) - 1;
        return isNaN(m) ? 0 : Math.max(0, Math.min(11, m));
      }
      return 0;
    }

    function fmtDateShort(dateStr) {
      if (!dateStr) return '';
      const p = dateStr.split('-');
      if (p.length !== 3) return dateStr;
      return `${p[2]} ${MONTHS_SHORT[parseInt(p[1], 10) - 1]}`;
    }

    function analyzeBook(book, targetMonth = selectedMonth) {
      const sortedRawChapters = getSortedChapters(book.chapters);

      const chapters = sortedRawChapters.map(ch => {
        const txs = book.transactions.filter(t => t.chapterId === ch.id);
        const byMonth = Array.from({ length: 12 }, () => ({
          income: 0,
          salaryIncome: 0,
          expense: 0,
          incomeTxs: [],
          expenseTxs: []
        }));

        let totalIncome = 0;
        let totalExpense = 0;

        txs.forEach(t => {
          const m = getTxMonth(t);
          const amt = Number(t.amount) || 0;
          if (t.type === 'income') {
            totalIncome += amt;
            byMonth[m].income += amt;
            if (t.source === 'salary') {
              byMonth[m].salaryIncome += amt;
            }
            byMonth[m].incomeTxs.push(t);
          } else {
            totalExpense += amt;
            byMonth[m].expense += amt;
            byMonth[m].expenseTxs.push(t);
          }
        });

        const initBal = Number(ch.initialBalance) || 0;

        let monthStartBalance = initBal;
        for (let m = 0; m < targetMonth; m++) {
          monthStartBalance += byMonth[m].income - byMonth[m].expense;
        }

        const monthIncome = byMonth[targetMonth].income;
        const monthSalaryIncome = byMonth[targetMonth].salaryIncome;
        const monthExpense = byMonth[targetMonth].expense;

        const balanceAtMonthEnd = Number((monthStartBalance + monthIncome - monthExpense).toFixed(2));
        const annualEndBalance = Number((initBal + totalIncome - totalExpense).toFixed(2));

        return {
          ...ch,
          closed: Boolean(ch.closed),
          closedDate: ch.closedDate || null,
          closedMonth: typeof ch.closedMonth === 'number' ? ch.closedMonth : null,
          initialBalance: Number(initBal.toFixed(2)),
          quota: Number((Number(ch.quota) || 0).toFixed(2)),
          totalIncome: Number(totalIncome.toFixed(2)),
          totalExpense: Number(totalExpense.toFixed(2)),
          monthStartBalance: Number(monthStartBalance.toFixed(2)),
          monthIncome: Number(monthIncome.toFixed(2)),
          monthSalaryIncome: Number(monthSalaryIncome.toFixed(2)),
          monthExpense: Number(monthExpense.toFixed(2)),
          balanceAtMonthEnd,
          annualEndBalance,
          byMonth
        };
      });

      const summary = {
        totalInitial: chapters.reduce((s, c) => s + c.initialBalance, 0),
        totalIncome: chapters.reduce((s, c) => s + c.totalIncome, 0),
        totalExpense: chapters.reduce((s, c) => s + c.totalExpense, 0),
        totalAtMonthEnd: chapters.reduce((s, c) => s + c.balanceAtMonthEnd, 0),
        totalAnnualEnd: chapters.reduce((s, c) => s + c.annualEndBalance, 0),
        monthIncomeTotal: chapters.reduce((s, c) => s + c.monthIncome, 0),
        monthExpenseTotal: chapters.reduce((s, c) => s + c.monthExpense, 0),
        monthlyIncome: Array.from({ length: 12 }, (_, m) => chapters.reduce((s, c) => s + c.byMonth[m].income, 0)),
        monthlyExpense: Array.from({ length: 12 }, (_, m) => chapters.reduce((s, c) => s + c.byMonth[m].expense, 0))
      };

      return { chapters, summary };
    }

          tab.classList.add('text-emeraldPro-700');
          icon.classList.remove('ph-bold');
          icon.classList.add('ph-fill');
          label.classList.replace('font-semibold', 'font-extrabold');
        } else {
          sec.classList.add('hidden');
          tab.classList.add('text-stoneInk-500');
          tab.classList.remove('text-emeraldPro-700');
          icon.classList.add('ph-bold');

    function applyChapterSort(list) {
      return [...list].sort((a, b) => {
        if (a.closed !== b.closed) return a.closed ? 1 : -1;
        if (chapterSortMode === 'za') {
          return (b.name || '').localeCompare(a.name || '', 'es', { sensitivity: 'base' });
        }
        if (chapterSortMode === 'bal_asc') {
          return a.balanceAtMonthEnd - b.balanceAtMonthEnd;
        }
        if (chapterSortMode === 'bal_desc') {
          return b.balanceAtMonthEnd - a.balanceAtMonthEnd;
        }
        return (a.name || '').localeCompare(b.name || '', 'es', { sensitivity: 'base' });
      });
    }

    // =========================================================================
    // 7. VISTA 3: CRONOLÓGICO
    // =========================================================================
    function initChronoListeners() {
      const searchInput = document.getElementById('chronoSearchInput');
      const chapterSelect = document.getElementById('chronoChapterSelect');
      const monthSelect = document.getElementById('chronoMonthSelect');
      const typeSelect = document.getElementById('chronoTypeSelect');

      MONTHS_FULL.forEach((m, idx) => {
        const opt = document.createElement('option');
        opt.value = String(idx);
        opt.textContent = m;
        monthSelect.appendChild(opt);
      });

      searchInput.addEventListener('input', (e) => {
        chronoFilter.search = e.target.value;
        renderChronoListAndKPI();
      });

      chapterSelect.addEventListener('change', (e) => {
        chronoFilter.chapterId = e.target.value;
        renderChronoListAndKPI();
      });

      monthSelect.addEventListener('change', (e) => {
        chronoFilter.month = e.target.value;
        renderChronoListAndKPI();
      });

      typeSelect.addEventListener('change', (e) => {
        chronoFilter.type = e.target.value;
        renderChronoListAndKPI();
      });
    }

    function renderChronoDropdowns() {
      const book = getActiveBook();
      const sortedChs = getSortedChapters(book.chapters);
      const chSelect = document.getElementById('chronoChapterSelect');
      chSelect.innerHTML = `<option value="all">Todos cap.</option>` +
        sortedChs.map(c => `<option value="${c.id}">${esc(c.name)}${c.closed ? ' (Cerrado)' : ''}</option>`).join('');

      if (!book.chapters.some(c => c.id === chronoFilter.chapterId)) {
        chronoFilter.chapterId = 'all';
      }
      chSelect.value = chronoFilter.chapterId;
      document.getElementById('chronoMonthSelect').value = chronoFilter.month;
      document.getElementById('chronoTypeSelect').value = chronoFilter.type;
    }

    function clearChronoFilters() {
      chronoFilter = { search: '', chapterId: 'all', month: 'all', type: 'all' };
      document.getElementById('chronoSearchInput').value = '';
      renderChronoDropdowns();
      renderChronoListAndKPI();
      showToast('Filtros limpiados');
    }

    function renderChronoListAndKPI() {
      const book = getActiveBook();
      const chMap = Object.fromEntries(book.chapters.map(c => [c.id, c]));

      const filtered = book.transactions.filter(tx => {
        if (chronoFilter.chapterId !== 'all' && tx.chapterId !== chronoFilter.chapterId) return false;
        if (chronoFilter.month !== 'all' && getTxMonth(tx) !== parseInt(chronoFilter.month, 10)) return false;

        if (chronoFilter.type !== 'all') {
          if (chronoFilter.type === 'transfer') {
            if (!tx.transferId) return false;
          } else if (tx.type !== chronoFilter.type) {
            return false;
          }
        }

        if (chronoFilter.search.trim() !== '') {
          const q = chronoFilter.search.toLowerCase().trim();
          const concept = (tx.concept || '').toLowerCase();
          const note = (tx.note || '').toLowerCase();
          const chName = (chMap[tx.chapterId]?.name || '').toLowerCase();
          const amtComma = String(tx.amount).replace('.', ',');
          const amtFormatted = formatSpanishNumber(tx.amount);
          if (!concept.includes(q) && !note.includes(q) && !chName.includes(q) && !amtComma.includes(q) && !amtFormatted.includes(q) && !String(tx.amount).includes(q)) {
            return false;
          }
        }
        return true;
      });

      filtered.sort((a, b) => (b.date || '').localeCompare(a.date || ''));

      const sumIncome = filtered.filter(t => t.type === 'income').reduce((s, t) => s + (Number(t.amount) || 0), 0);
      const sumExpense = filtered.filter(t => t.type === 'expense').reduce((s, t) => s + (Number(t.amount) || 0), 0);
      const netSum = sumIncome - sumExpense;

      const mainKpiValue = chronoFilter.type === 'expense'
        ? '-' + fmtEur(sumExpense)
        : chronoFilter.type === 'income'
          ? '+' + fmtEur(sumIncome)
          : fmtEur(netSum);

      const mainKpiColor = chronoFilter.type === 'expense'
        ? 'text-orange-300'
        : chronoFilter.type === 'income'
          ? 'text-emerald-400'
          : netSum < -0.005 ? 'text-rose-400' : 'text-white';

      document.getElementById('chrono-kpi').innerHTML = `
        <div class="bg-stoneInk-900 text-white rounded-2xl p-3.5 shadow-sm flex items-center justify-between gap-2">
          <div class="min-w-0">
            <span class="text-[10px] uppercase tracking-wider text-stoneInk-400 font-bold block truncate">
              Sumatorio (${filtered.length} apuntes)
            </span>
            <span class="font-mono text-lg sm:text-xl font-extrabold tabular-nums whitespace-nowrap mt-0.5 block ${mainKpiColor}">
              ${mainKpiValue}
            </span>
          </div>

          <div class="flex items-center gap-3 text-right font-mono tabular-nums shrink-0">
            <div>
              <span class="text-[10px] font-sans text-stoneInk-400 block">Ingresos</span>
              <span class="text-xs font-bold text-emerald-400 whitespace-nowrap">+${fmtEur(sumIncome)}</span>
            </div>
            <div>
              <span class="text-[10px] font-sans text-stoneInk-400 block">Gastos</span>
              <span class="text-xs font-bold text-orange-300 whitespace-nowrap">-${fmtEur(sumExpense)}</span>
            </div>
          </div>
        </div>
      `;

      const resultsBox = document.getElementById('chrono-results');
      if (filtered.length === 0) {
        resultsBox.innerHTML = `
          <div class="bg-white border border-cream-300 rounded-2xl p-8 text-center">
            <i class="ph-duotone ph-magnifying-glass text-4xl text-stoneInk-400"></i>
            <p class="text-sm font-bold text-stoneInk-700 mt-2">No hay apuntes con estos filtros</p>
            <button onclick="clearChronoFilters()" class="mt-3 text-xs font-extrabold text-terra-600 underline">
              Limpiar filtros
            </button>
          </div>
        `;
        return;
      }

      resultsBox.innerHTML = filtered.map(tx => {
        const ch = chMap[tx.chapterId] || { name: 'Capítulo' };
        const isInc = tx.type === 'income';
        const isTransfer = Boolean(tx.transferId);

        return `
          <div onclick="openTxModal('${tx.id}')"
            class="bg-white hover:bg-cream-50 active:scale-[0.99] transition-all border border-cream-300 rounded-2xl p-3.5 flex items-center justify-between gap-3 cursor-pointer shadow-sm">
            <div class="flex items-center gap-3 min-w-0">
              <div class="w-10 h-10 rounded-xl flex items-center justify-center shrink-0 ${
                isTransfer
                  ? 'bg-sky-50 text-sky-700'
                  : isInc ? 'bg-emeraldPro-50 text-emeraldPro-700' : 'bg-terra-50 text-terra-600'
              }">
                <i class="ph-bold ${
                  isTransfer
                    ? 'ph-arrows-left-right'
                    : isInc ? 'ph-arrow-down-left' : 'ph-arrow-up-right'
                } text-lg"></i>
              </div>
              <div class="min-w-0">
                <p class="text-sm font-bold text-stoneInk-900 truncate">${esc(tx.concept)}</p>
                ${tx.note ? `<p class="text-xs text-stoneInk-500 truncate">${esc(tx.note)}</p>` : ''}
                <div class="flex items-center gap-2 mt-1">
                  <span class="text-[10px] font-extrabold bg-cream-200 text-stoneInk-700 px-2 py-0.5 rounded-md">
                    ${esc(ch.name)}${ch.closed ? ' · Cerrado' : ''}
                  </span>
                  <span class="text-[11px] font-medium text-stoneInk-400">${fmtDateShort(tx.date)}</span>
                </div>
              </div>
            </div>

            <span class="font-mono text-sm sm:text-base font-extrabold tabular-nums whitespace-nowrap shrink-0 ${
              isInc ? 'text-emeraldPro-700' : 'text-terra-600'
            }">
              ${isInc ? '+' : '-'}${fmtEur(tx.amount)}
            </span>
          </div>
        `;
      }).join('');
    }

    // =========================================================================
    // 7B. VISTA 4: GRÁFICOS ANALÍTICOS
    // =========================================================================
    function setChartDonutMode(mode) {
      chartDonutMode = mode;
      renderChartsView();
    }

    function setChartDonutMonth(m) {
      chartDonutMonth = parseInt(m, 10);
      chartDonutMode = 'month_expense';
      renderChartsView();
    }

    function inspectChartMonth(m) {
      chartInspectMonth = (chartInspectMonth === m) ? null : m;
      renderChartsView();
    }

    function renderChartsView() {
      const book = getActiveBook();
      const { chapters, summary } = analyzeBook(book, chartDonutMonth);

      if (chapters.length === 0) {
        document.getElementById('view-charts').innerHTML = `
          <div class="bg-white border border-cream-300 rounded-2xl p-8 text-center">
            <i class="ph-duotone ph-chart-pie-slice text-4xl text-stoneInk-400"></i>
            <p class="text-sm font-bold text-stoneInk-700 mt-2">Aún no hay datos en ${book.year}</p>
            <p class="text-xs text-stoneInk-500 mt-1">Añade capítulos y movimientos para visualizar tus gráficos.</p>
          </div>
        `;
        return;
      }

      let peakMonthIdx = 0;
      let peakMonthVal = 0;
      summary.monthlyExpense.forEach((v, idx) => {
        if (v > peakMonthVal) {
          peakMonthVal = v;
          peakMonthIdx = idx;
        }
      });

      let runningBal = summary.totalInitial;
      const cumulativeByMonth = Array.from({ length: 12 }, (_, m) => {
        runningBal += summary.monthlyIncome[m] - summary.monthlyExpense[m];
        return Number(runningBal.toFixed(2));
      });

      const allVals = [
        ...summary.monthlyIncome,
        ...summary.monthlyExpense,
        ...cumulativeByMonth,
        0
      ];
      const maxVal = Math.max(...allVals, 100);
      const minVal = Math.min(...allVals, 0);
      const span = Math.max(maxVal - minVal, 1);

      const svgW = 680;
      const svgH = 235;
      const padL = 14;
      const padR = 14;
      const padT = 22;
      const padB = 28;
      const plotW = svgW - padL - padR;
      const plotH = svgH - padT - padB;
      const colStep = plotW / 12;

      const yScale = (val) => padT + ((maxVal - val) / span) * plotH;
      const yZero = yScale(0);

      let highlightSvg = '';
      let barsSvg = '';
      let linePoints = [];
      let dotsSvg = '';
      let labelsSvg = '';
      let hitZonesSvg = '';

      for (let m = 0; m < 12; m++) {
        const colLeft = padL + m * colStep;
        const cx = colLeft + colStep / 2;
        const inc = summary.monthlyIncome[m];
        const exp = summary.monthlyExpense[m];
        const cum = cumulativeByMonth[m];
        const isInspected = chartInspectMonth === m;

        if (isInspected) {
          highlightSvg += `
            <rect x="${(colLeft + 3).toFixed(1)}" y="${padT - 8}" width="${(colStep - 6).toFixed(1)}" height="${(plotH + 30).toFixed(1)}" rx="10" fill="#F0FDFA" stroke="#0F766E" stroke-width="1.5" />
          `;
        }

        const barW = Math.min(14, colStep * 0.28);
        const yInc = yScale(inc);
        const hInc = Math.max(0, yZero - yInc);
        const yExp = yScale(exp);
        const hExp = Math.max(0, yZero - yExp);

        barsSvg += `
          <rect x="${(cx - barW - 1.5).toFixed(1)}" y="${yInc.toFixed(1)}" width="${barW.toFixed(1)}" height="${hInc.toFixed(1)}" rx="3" fill="#0F766E" opacity="0.9" />
          <rect x="${(cx + 1.5).toFixed(1)}" y="${yExp.toFixed(1)}" width="${barW.toFixed(1)}" height="${hExp.toFixed(1)}" rx="3" fill="#EA580C" opacity="0.9" />
        `;

        const yCum = yScale(cum);
        linePoints.push(`${cx.toFixed(1)},${yCum.toFixed(1)}`);
        dotsSvg += `
          <circle cx="${cx.toFixed(1)}" cy="${yCum.toFixed(1)}" r="${isInspected ? 6.5 : 4.2}" fill="${isInspected ? '#0F766E' : '#1C1917'}" stroke="#FFFFFF" stroke-width="2" />
        `;

        labelsSvg += `
          <text x="${cx.toFixed(1)}" y="${svgH - 8}" text-anchor="middle" font-size="11" font-weight="${isInspected ? '800' : '700'}" fill="${isInspected ? '#0F766E' : '#78716C'}">
            ${MONTHS_SHORT[m]}
          </text>
        `;

        hitZonesSvg += `
          <rect x="${colLeft.toFixed(1)}" y="0" width="${colStep.toFixed(1)}" height="${svgH}" fill="transparent" class="cursor-pointer" onclick="inspectChartMonth(${m})" />
        `;
      }

      const comboChartSvg = `
        <svg viewBox="0 0 ${svgW} ${svgH}" class="w-full h-auto overflow-visible select-none">
          ${highlightSvg}
          <line x1="${padL}" y1="${yZero.toFixed(1)}" x2="${svgW - padR}" y2="${yZero.toFixed(1)}" stroke="#E2DDD2" stroke-width="1.5" stroke-dasharray="4 3" />
          ${barsSvg}
          <polyline fill="none" stroke="#1C1917" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" points="${linePoints.join(' ')}" />
          ${dotsSvg}
          ${labelsSvg}
          ${hitZonesSvg}
        </svg>
      `;

      // Siempre 2 líneas por columna (Título arriba, Importe completo con € en una sola línea debajo)
      const inspectedBannerHtml = chartInspectMonth !== null
        ? `
          <div class="bg-stoneInk-900 text-white rounded-2xl p-3 space-y-2.5 text-xs animate-fade">
            <div class="flex items-center justify-between gap-2">
              <div class="flex items-center gap-2">
                <span class="bg-emeraldPro-600 text-white font-extrabold px-2.5 py-0.5 rounded-lg">${MONTHS_FULL[chartInspectMonth]}</span>
                <span class="text-stoneInk-300 font-semibold">Detalle del mes</span>
              </div>
              <button onclick="inspectChartMonth(${chartInspectMonth})" class="text-[11px] text-stoneInk-400 hover:text-white">Cerrar</button>
            </div>
            <div class="grid grid-cols-3 gap-2 pt-2 border-t border-stoneInk-700/80 text-center">
              <div class="bg-stoneInk-700/40 rounded-xl px-1.5 py-2 min-w-0">
                <span class="text-[10px] font-sans uppercase tracking-wider text-stoneInk-400 block">Ing.</span>
                <span class="font-mono text-xs sm:text-sm font-bold text-emerald-400 tabular-nums whitespace-nowrap block mt-0.5">
                  +${fmtEur(summary.monthlyIncome[chartInspectMonth])}
                </span>
              </div>
              <div class="bg-stoneInk-700/40 rounded-xl px-1.5 py-2 min-w-0">
                <span class="text-[10px] font-sans uppercase tracking-wider text-stoneInk-400 block">Gtos</span>
                <span class="font-mono text-xs sm:text-sm font-bold text-orange-300 tabular-nums whitespace-nowrap block mt-0.5">
                  -${fmtEur(summary.monthlyExpense[chartInspectMonth])}
                </span>
              </div>
              <div class="bg-stoneInk-700/40 rounded-xl px-1.5 py-2 min-w-0">
                <span class="text-[10px] font-sans uppercase tracking-wider text-stoneInk-400 block">Acum.</span>
                <span class="font-mono text-xs sm:text-sm font-extrabold text-white tabular-nums whitespace-nowrap block mt-0.5">
                  ${fmtEur(cumulativeByMonth[chartInspectMonth])}
                </span>
              </div>
            </div>
          </div>
        `
        : `
          <p class="text-[11px] text-stoneInk-400 text-center">
            Toca cualquier mes en el gráfico para ver sus cifras exactas de ingresos, gastos y acumulado
          </p>
        `;

      let donutTitle = '';
      let rawSlices = [];

      if (chartDonutMode === 'month_expense') {
        donutTitle = `Gastos en ${MONTHS_FULL[chartDonutMonth]} (${book.year})`;
        rawSlices = chapters
          .map((c, idx) => ({ name: c.name, value: Math.max(0, Number(c.monthExpense.toFixed(2))), color: CHART_PALETTE[idx % CHART_PALETTE.length] }))
          .filter(s => s.value > 0.005);
      } else {
        donutTitle = `Gastos acumulados en ${book.year}`;
        rawSlices = chapters
          .map((c, idx) => ({ name: c.name, value: Math.max(0, c.totalExpense), color: CHART_PALETTE[idx % CHART_PALETTE.length] }))
          .filter(s => s.value > 0.005);
      }

      rawSlices.sort((a, b) => b.value - a.value);
      const donutTotal = rawSlices.reduce((s, x) => s + x.value, 0);

      let donutHtml = '';
      if (donutTotal <= 0.005) {
        donutHtml = `
          <div class="py-10 text-center text-xs text-stoneInk-500">
            No hay importes positivos para graficar en esta selección.
          </div>
        `;
      } else {
        const r = 64;
        const circumference = 2 * Math.PI * r;
        let offset = 0;

        const circlesSvg = rawSlices.map(sl => {
          const pct = sl.value / donutTotal;
          const dash = pct * circumference;
          const seg = `
            <circle cx="85" cy="85" r="${r}" fill="transparent"
              stroke="${sl.color}" stroke-width="24"
              stroke-dasharray="${dash.toFixed(2)} ${circumference.toFixed(2)}"
              stroke-dashoffset="${(-offset).toFixed(2)}" />
          `;
          offset += dash;
          return seg;
        }).join('');

        const legendHtml = rawSlices.map(sl => {
          const pct = ((sl.value / donutTotal) * 100).toFixed(1).replace('.', ',');
          return `
            <div class="flex items-center justify-between gap-2 py-1.5 border-b border-cream-200 last:border-0 text-xs">
              <div class="flex items-center gap-2 min-w-0">
                <span class="w-3 h-3 rounded-full shrink-0" style="background-color:${sl.color}"></span>
                <span class="font-bold text-stoneInk-800 truncate">${esc(sl.name)}</span>
              </div>
              <div class="flex items-center gap-2 font-mono tabular-nums shrink-0">
                <span class="text-[11px] text-stoneInk-500">${pct}%</span>
                <strong class="text-stoneInk-900 whitespace-nowrap">${fmtEur(sl.value)}</strong>
              </div>
            </div>
          `;
        }).join('');

        donutHtml = `
          <div class="flex flex-col sm:flex-row items-center gap-5 pt-2">
            <div class="relative w-44 h-44 shrink-0 flex items-center justify-center">
              <svg viewBox="0 0 170 170" class="w-full h-full -rotate-90">
                ${circlesSvg}
              </svg>
              <div class="absolute inset-0 flex flex-col items-center justify-center text-center px-4">
                <span class="text-[10px] font-bold uppercase text-stoneInk-400">Total</span>
                <span class="font-mono text-xs font-extrabold text-stoneInk-900 tabular-nums whitespace-nowrap mt-0.5">${fmtEur(donutTotal)}</span>
              </div>
            </div>

            <div class="w-full flex-1 max-h-56 overflow-y-auto pr-1">
              ${legendHtml}
            </div>
          </div>
        `;
      }

      document.getElementById('view-charts').innerHTML = `
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
          <div class="bg-white border border-cream-300 rounded-2xl p-3 shadow-sm">
            <span class="text-[10px] font-bold uppercase text-stoneInk-400 block">Ingresos ${book.year}</span>
            <span class="font-mono text-sm sm:text-base font-extrabold text-emeraldPro-700 tabular-nums whitespace-nowrap mt-0.5 block">
              +${fmtEur(summary.totalIncome)}
            </span>
          </div>
          <div class="bg-white border border-cream-300 rounded-2xl p-3 shadow-sm">
            <span class="text-[10px] font-bold uppercase text-stoneInk-400 block">Gastos ${book.year}</span>
            <span class="font-mono text-sm sm:text-base font-extrabold text-terra-600 tabular-nums whitespace-nowrap mt-0.5 block">
              -${fmtEur(summary.totalExpense)}
            </span>
          </div>
          <div class="bg-white border border-cream-300 rounded-2xl p-3 shadow-sm">
            <span class="text-[10px] font-bold uppercase text-stoneInk-400 block">Saldo actual</span>
            <span class="font-mono text-sm sm:text-base font-extrabold tabular-nums whitespace-nowrap mt-0.5 block ${summary.totalAnnualEnd < -0.005 ? 'text-terra-600' : 'text-emeraldPro-700'}">
              ${fmtEur(summary.totalAnnualEnd)}
            </span>
          </div>
          <div class="bg-white border border-cream-300 rounded-2xl p-3 shadow-sm">
            <span class="text-[10px] font-bold uppercase text-stoneInk-400 block">Mes Mayor Gasto</span>
            <span class="text-xs sm:text-sm font-extrabold text-stoneInk-900 mt-0.5 block">
              ${peakMonthVal > 0 ? `${MONTHS_SHORT[peakMonthIdx]} (${fmtEur(peakMonthVal)})` : '—'}
            </span>
          </div>
        </div>

        <div class="bg-white border border-cream-300 rounded-2xl p-4 shadow-sm space-y-3">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <div>
              <h3 class="font-extrabold text-sm text-stoneInk-900">Evolución Mensual (${book.year})</h3>
              <p class="text-[11px] text-stoneInk-500">Ingresos y gastos por mes frente al saldo acumulado</p>
            </div>
            <div class="flex items-center gap-3 text-[11px] font-bold">
              <span class="flex items-center gap-1 text-emeraldPro-700">
                <span class="w-2.5 h-2.5 rounded-sm bg-emeraldPro-700 inline-block"></span> Ingresos
              </span>
              <span class="flex items-center gap-1 text-terra-600">

                class="w-full bg-white border-2 border-emeraldPro-700 rounded-xl px-2.5 py-2 font-mono text-base font-extrabold text-stoneInk-900 focus:outline-none" />
            </div>
            <div class="col-span-4">
              <label class="block text-[11px] font-bold text-stoneInk-700 mb-1">Mes (${book.year})</label>

                class="w-full bg-white border border-cream-300 rounded-xl px-2.5 py-2.5 text-xs font-bold text-stoneInk-900 focus:outline-none">
                ${MONTHS_FULL.map((m, i) => `
                  <option value="${i}" ${i === selectedMonth ? 'selected' : ''}>${m}</option>

              <i class="ph-bold ph-magic-wand"></i>

          <div id="splitChaptersRows" class="space-y-2 max-h-60 overflow-y-auto pr-1"></div>

          <div id="splitStatusBox" class="bg-stoneInk-900 text-white rounded-2xl p-3.5 flex items-center justify-between text-xs font-mono tabular-nums">
            <span>Repartido: <strong id="splitAssignedLabel">0,00 €</strong></span>
            <span id="splitDiffLabel" class="text-amber-300 font-bold">Introduce importe</span>
          </div>

          <button type="submit" id="splitConfirmBtn" disabled
            class="w-full py-3.5 rounded-2xl bg-emeraldPro-700 hover:bg-emeraldPro-600 text-white font-extrabold text-sm shadow-md transition-all opacity-40 cursor-not-allowed">

    function onSplitMonthChange() {
      const mIdx = parseInt(document.getElementById('splitMonthSelect').value, 10);
      const book = getActiveBook();
      document.getElementById('splitDateInput').value = `${book.year}-${String(mIdx + 1).padStart(2, '0')}-01`;
      renderSplitRowsForMonth(mIdx, true);
    }

    function renderSplitRowsForMonth(mIdx, autoPrefill = false) {
      const book = getActiveBook();
      const { chapters } = analyzeBook(book, mIdx);
      const activeChapters = chapters.filter(c => !c.closed);
      const monthName = MONTHS_SHORT[mIdx];

      const totalAlreadyMonth = activeChapters.reduce((s, c) => s + c.monthSalaryIncome, 0);
      const totalPendingMonth = activeChapters.reduce((s, c) => s + Math.max(0, c.quota - c.monthSalaryIncome), 0);

      document.getElementById('splitMonthAlreadyBanner').innerHTML = totalAlreadyMonth > 0
        ? `Ya repartido en ${monthName}: <strong class="font-mono text-emeraldPro-700">${fmtEur(totalAlreadyMonth)}</strong>`
        : `Sin repartos previos en ${monthName}`;

      if (autoPrefill) {
        const totalInput = document.getElementById('splitTotalInput');
        if (totalPendingMonth > 0) {
          totalInput.value = totalPendingMonth.toFixed(2);
        } else {
          const sumQuotas = activeChapters.reduce((s, c) => s + c.quota, 0);
          totalInput.value = sumQuotas.toFixed(2);
        }
      }

      const container = document.getElementById('splitChaptersRows');
      container.innerHTML = activeChapters.map(ch => {
        const already = ch.monthSalaryIncome;
        const pending = Number(Math.max(0, ch.quota - already).toFixed(2));
        const initialVal = autoPrefill ? pending : 0;

        return `
          <div class="flex items-center justify-between gap-2.5 bg-white border border-cream-300 rounded-xl px-3 py-2.5">
            <div class="min-w-0">
              <div class="flex items-center gap-1.5">
                <p class="text-xs font-extrabold text-stoneInk-900 truncate">${esc(ch.name)}</p>
                ${pending <= 0.005 && ch.quota > 0
                  ? `<span class="text-[9px] font-extrabold bg-emeraldPro-100 text-emeraldPro-700 px-1.5 py-0.5 rounded">Completo</span>`
                  : ''
                }
              </div>
              <p class="text-[10px] text-stoneInk-500 mt-0.5 font-mono tabular-nums">
                Cuota: ${fmtEur(ch.quota)} · Metido: <strong class="text-emeraldPro-700">${fmtEur(already)}</strong> · Falta: <strong class="${pending > 0 ? 'text-terra-600' : 'text-stoneInk-500'}">${fmtEur(pending)}</strong>
              </p>
            </div>
            <div class="relative w-28 shrink-0">
              <input type="number" step="0.01" data-split-ch="${ch.id}" data-pending-quota="${pending}" data-base-quota="${ch.quota}"
                value="${initialVal.toFixed(2)}" oninput="recalcSplitTotals()"
                class="split-input w-full bg-cream-100 border border-cream-300 focus:border-emeraldPro-700 focus:bg-white rounded-lg pl-2.5 pr-6 py-1.5 text-right font-mono text-xs font-bold text-stoneInk-900 focus:outline-none" />
              <span class="absolute right-2 top-1/2 -translate-y-1/2 text-xs font-mono text-stoneInk-400">€</span>
            </div>
          </div>
        `;
      }).join('');

      recalcSplitTotals();
    }

    function fillPendingQuotasSplit() {
      const targetTotal = parseFloat(document.getElementById('splitTotalInput').value) || 0;
      const inputs = Array.from(document.querySelectorAll('.split-input'));
      const totalPending = inputs.reduce((s, inp) => s + (parseFloat(inp.dataset.pendingQuota) || 0), 0);

      if (targetTotal <= 0) {
        inputs.forEach(inp => {
          inp.value = (parseFloat(inp.dataset.pendingQuota) || 0).toFixed(2);
        });
        document.getElementById('splitTotalInput').value = totalPending.toFixed(2);
        recalcSplitTotals();
        return;
      }

      let remaining = targetTotal;
      inputs.forEach(inp => {
        const pend = parseFloat(inp.dataset.pendingQuota) || 0;
        if (remaining <= 0 || pend <= 0) {
          inp.value = '0.00';
        } else if (remaining >= pend) {
          inp.value = pend.toFixed(2);
          remaining = Number((remaining - pend).toFixed(2));
        } else {
          inp.value = remaining.toFixed(2);
          remaining = 0;
        }
      });

      recalcSplitTotals();
    }

    function recalcSplitTotals() {
      const targetTotal = parseFloat(document.getElementById('splitTotalInput').value) || 0;
      const inputs = Array.from(document.querySelectorAll('.split-input'));
      const assigned = inputs.reduce((s, inp) => s + (parseFloat(inp.value) || 0), 0);
      const diff = Number((targetTotal - assigned).toFixed(2));

      document.getElementById('splitAssignedLabel').textContent = fmtEur(assigned);
      const diffEl = document.getElementById('splitDiffLabel');
      const btn = document.getElementById('splitConfirmBtn');

      if (targetTotal <= 0) {
        diffEl.textContent = 'Importe debe ser > 0';
        diffEl.className = 'text-rose-400 font-bold';
        btn.disabled = true;
        btn.classList.add('opacity-40', 'cursor-not-allowed');
        return;
      }

      if (Math.abs(diff) < 0.005) {
        diffEl.textContent = 'Cuadrado (100%)';
        diffEl.className = 'text-emerald-400 font-bold';
        btn.disabled = false;
        btn.classList.remove('opacity-40', 'cursor-not-allowed');
      } else if (diff > 0) {
        diffEl.textContent = `Faltan ${fmtEur(diff)}`;
        diffEl.className = 'text-amber-300 font-bold';
        btn.disabled = true;
        btn.classList.add('opacity-40', 'cursor-not-allowed');
      } else {
        diffEl.textContent = `Sobran ${fmtEur(Math.abs(diff))}`;
        diffEl.className = 'text-rose-400 font-bold';
        btn.disabled = true;
        btn.classList.add('opacity-40', 'cursor-not-allowed');
      }
    }

    function submitSalarySplit(e) {
      e.preventDefault();
      const targetTotal = parseFloat(document.getElementById('splitTotalInput').value) || 0;
      const inputs = Array.from(document.querySelectorAll('.split-input'));
      const assigned = inputs.reduce((s, inp) => s + (parseFloat(inp.value) || 0), 0);
      const diff = Number((targetTotal - assigned).toFixed(2));

      if (targetTotal <= 0 || Math.abs(diff) >= 0.005) {
        showToast(
          diff > 0
            ? `Faltan ${fmtEur(diff)} por repartir`
            : `Te has pasado por ${fmtEur(Math.abs(diff))}`,
          'error'
        );
        return;
      }

      const book = getActiveBook();
      const mIdx = parseInt(document.getElementById('splitMonthSelect').value, 10);
      const dateStr = document.getElementById('splitDateInput').value || `${book.year}-${String(mIdx + 1).padStart(2, '0')}-01`;

      let added = 0;
      inputs.forEach((inp, idx) => {
        const val = parseFloat(inp.value) || 0;
        if (Math.abs(val) > 0.001) {
          book.transactions.push({
            id: `tx_${Date.now()}_${idx}`,
            type: 'income',
            source: 'salary',
            chapterId: inp.dataset.splitCh,
            amount: Number(val.toFixed(2)),
            concept: `Reparto sueldo (${MONTHS_FULL[mIdx]})`,
            note: '',
            date: dateStr,
            month: mIdx
          });
          added++;
        }
      });

      if (added === 0) {
        showToast('Reparte al menos un importe mayor que 0', 'error');
        return;
      }

      selectedMonth = mIdx;
      saveState();
      closeModal();
      renderAll();
      showToast(`Sueldo repartido en ${added} capítulos`);
    }

    // --- B. MODAL NUEVO / EDITAR APUNTE ---
    function openTxModal(txId = null, defaultChapterId = null, defaultMonthIdx = null, defaultType = 'expense') {
      const book = getActiveBook();
      const { chapters } = analyzeBook(book, selectedMonth);
      const activeChapters = chapters.filter(c => !c.closed);
      const existing = txId ? book.transactions.find(t => t.id === txId) : null;

      if (activeChapters.length === 0 && !existing) {
        showToast('Crea primero un capítulo antes de apuntar', 'error');
        return;
      }

      const mTarget = existing ? getTxMonth(existing) : (defaultMonthIdx !== null ? defaultMonthIdx : selectedMonth);
      const defaultDate = existing
        ? existing.date
        : `${book.year}-${String(mTarget + 1).padStart(2, '0')}-15`;

      let initialMode = defaultType;
      let fromChId = defaultChapterId || '';
      let toChId = '';
      let amtVal = '';
      let conceptVal = '';
      let noteVal = '';

      if (existing) {
        if (existing.transferId) {
          initialMode = 'transfer';
          const pair = book.transactions.filter(t => t.transferId === existing.transferId);
          const outTx = pair.find(t => t.type === 'expense') || existing;
          const inTx = pair.find(t => t.type === 'income') || existing;
          fromChId = outTx.chapterId;
          toChId = inTx.chapterId;
          amtVal = outTx.amount;
          conceptVal = outTx.concept.replace(/^Traspaso a [^:]+:\s*/i, '');
          noteVal = outTx.note || '';
        } else {
          initialMode = existing.type;
          fromChId = existing.chapterId;
          amtVal = existing.amount;
          conceptVal = existing.concept;
          noteVal = existing.note || '';
        }
      }

      const buildChapterOptions = (selectedId) => {
        const list = existing ? chapters : activeChapters;
        return `<option value="">— Selecciona un capítulo —</option>` +
          list.map(c => `
            <option value="${c.id}" ${c.id === selectedId ? 'selected' : ''}>
              ${esc(c.name)} (Disp: ${fmtEur(c.annualEndBalance)})
            </option>
          `).join('');
      };

      openModal(`
        <div class="px-5 pt-4 pb-3 border-b border-cream-200 flex items-center justify-between bg-white">
          <h3 class="font-extrabold text-base text-stoneInk-900">${existing ? 'Editar Apunte' : 'Nuevo Apunte'}</h3>
          <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-cream-200 flex items-center justify-center text-stoneInk-700">
            <i class="ph-bold ph-x"></i>
          </button>
        </div>

        <form onsubmit="saveTransaction(event, '${txId || ''}')" class="p-5 space-y-4 overflow-y-auto">
          <div class="grid grid-cols-3 gap-1.5 p-1 bg-cream-200 rounded-2xl">
            <label class="cursor-pointer">
              <input type="radio" name="txMode" value="expense" class="peer sr-only" onchange="toggleTxModeFields()" ${initialMode === 'expense' ? 'checked' : ''} />
              <div class="py-2 text-center rounded-xl text-xs font-extrabold transition-all peer-checked:bg-terra-600 peer-checked:text-white text-stoneInk-700">
                − Gasto
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="txMode" value="income" class="peer sr-only" onchange="toggleTxModeFields()" ${initialMode === 'income' ? 'checked' : ''} />
              <div class="py-2 text-center rounded-xl text-xs font-extrabold transition-all peer-checked:bg-emeraldPro-700 peer-checked:text-white text-stoneInk-700">
                + Ingreso
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="txMode" value="transfer" class="peer sr-only" onchange="toggleTxModeFields()" ${initialMode === 'transfer' ? 'checked' : ''} />
              <div class="py-2 text-center rounded-xl text-xs font-extrabold transition-all peer-checked:bg-sky-700 peer-checked:text-white text-stoneInk-700">
                ⇄ Traspaso
              </div>
            </label>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-bold text-stoneInk-700 mb-1">Importe (€)</label>
              <input type="number" step="0.01" required id="txAmount" value="${amtVal}" placeholder="0,00"
                class="w-full bg-white border-2 border-cream-300 focus:border-stoneInk-900 rounded-xl px-3 py-2.5 font-mono text-xl font-extrabold text-stoneInk-900 focus:outline-none" />
            </div>
            <div>
              <label class="block text-xs font-bold text-stoneInk-700 mb-1">Fecha</label>
              <input type="date" required id="txDate" value="${defaultDate}"

          <div>

    function toggleTxModeFields() {
      const mode = document.querySelector('input[name="txMode"]:checked')?.value || 'expense';
      const destGroup = document.getElementById('txDestChapterGroup');
      const destSelect = document.getElementById('txDestChapter');
      const label = document.getElementById('txChapterLabel');

      if (mode === 'transfer') {
        destGroup.classList.remove('hidden');
        destSelect.setAttribute('required', 'required');
        label.textContent = 'Capítulo de origen (sale dinero)';
      } else {
        destGroup.classList.add('hidden');
        destSelect.removeAttribute('required');
        label.textContent = 'Capítulo';
      }
    }

    function saveTransaction(e, txId) {
      e.preventDefault();
      const book = getActiveBook();
      const mode = document.querySelector('input[name="txMode"]:checked').value;
      const amount = parseFloat(document.getElementById('txAmount').value);
      const date = document.getElementById('txDate').value;
      const chapterId = document.getElementById('txChapter').value;
      const destChapterId = document.getElementById('txDestChapter')?.value || '';
      const concept = document.getElementById('txConcept').value.trim();
      const note = document.getElementById('txNote').value.trim();

      if (!chapterId) {
        showToast('Selecciona un capítulo', 'error');
        return;
      }
      if (isNaN(amount) || amount === 0) {
        showToast('Introduce un importe distinto de 0', 'error');
        return;
      }
      if (mode === 'transfer') {
        if (!destChapterId) {
          showToast('Selecciona el capítulo de destino', 'error');
          return;
        }
        if (chapterId === destChapterId) {
          showToast('El origen y el destino deben ser distintos', 'error');
          return;
        }
      }

      const monthIdx = date && date.length >= 7
        ? Math.max(0, Math.min(11, parseInt(date.split('-')[1], 10) - 1))
        : selectedMonth;

      if (txId) {
        const prev = book.transactions.find(t => t.id === txId);
        if (prev && prev.transferId) {
          book.transactions = book.transactions.filter(t => t.transferId !== prev.transferId);
        } else {
          book.transactions = book.transactions.filter(t => t.id !== txId);
        }
      }

      if (mode === 'transfer') {
        const fromCh = book.chapters.find(c => c.id === chapterId);
        const toCh = book.chapters.find(c => c.id === destChapterId);
        const trId = 'tr_' + Date.now();
        const absAmt = Number(Math.abs(amount).toFixed(2));

        book.transactions.push({
          id: `${trId}_out`,
          transferId: trId,
          type: 'expense',
          chapterId,
          amount: absAmt,
          concept: `Traspaso a ${toCh ? toCh.name : 'destino'}: ${concept}`,
          note,
          date,
          month: monthIdx
        });

        book.transactions.push({
          id: `${trId}_in`,
          transferId: trId,
          type: 'income',
          source: 'transfer',
          chapterId: destChapterId,
          amount: absAmt,
          concept: `Traspaso desde ${fromCh ? fromCh.name : 'origen'}: ${concept}`,
          note,
          date,
          month: monthIdx
        });
      } else {
        book.transactions.push({
          id: txId || ('tx_' + Date.now()),
          type: mode,
          source: mode === 'income' ? 'extra' : undefined,
          chapterId,
          amount: Number(amount.toFixed(2)),
          concept,
          note,
          date,
          month: monthIdx
        });
      }

      saveState();
      closeModal();
      renderAll();
      showToast(
        txId
          ? 'Apunte actualizado'
          : mode === 'transfer'
            ? 'Traspaso realizado entre capítulos'
            : mode === 'income'
              ? 'Ingreso guardado'
              : 'Gasto guardado'
      );
    }

    function deleteTransaction(txId) {
      const book = getActiveBook();
      const target = book.transactions.find(t => t.id === txId);
      if (target && target.transferId) {
        book.transactions = book.transactions.filter(t => t.transferId !== target.transferId);
      } else {
        book.transactions = book.transactions.filter(t => t.id !== txId);
      }
      saveState();
      closeModal();
      renderAll();
      showToast('Apunte eliminado');
    }

    // --- E. MODAL DETALLE Y ELIMINACIÓN DE CAPÍTULO ---

    function initiateDeleteChapter(chapterId) {
      const book = getActiveBook();
      const { chapters } = analyzeBook(book, 11);
      const ch = chapters.find(c => c.id === chapterId);
      if (!ch) return;

      const chTxs = book.transactions.filter(t => t.chapterId === chapterId);
      const otherActiveChapters = chapters.filter(c => c.id !== chapterId && !c.closed);
      const hasBalance = Math.abs(ch.annualEndBalance) >= 0.005;

      const today = new Date();
      const defaultDate = today.getFullYear() === book.year
        ? today.toISOString().slice(0, 10)
        : `${book.year}-${String(selectedMonth + 1).padStart(2, '0')}-28`;

      if (!hasBalance && chTxs.length === 0) {
        openModal(`
          <div class="px-5 pt-4 pb-3 border-b border-cream-200 flex items-center justify-between bg-white">
            <h3 class="font-extrabold text-base text-stoneInk-900">Eliminar capítulo vacío</h3>
            <button onclick="openChapterModal('${ch.id}')" class="w-8 h-8 rounded-full bg-cream-200 flex items-center justify-center text-stoneInk-700">
              <i class="ph-bold ph-x"></i>
            </button>
          </div>
          <div class="p-5 space-y-4">
            <p class="text-xs text-stoneInk-700 leading-relaxed">
              El capítulo <strong>"${esc(ch.name)}"</strong> tiene saldo <strong>0,00 €</strong> y ningún apunte. ¿Confirmas su eliminación?
            </p>
            <div class="flex gap-2">
              <button type="button" onclick="openChapterModal('${ch.id}')"
                class="flex-1 py-3 rounded-2xl bg-cream-200 text-stoneInk-800 font-extrabold text-xs">
                Cancelar
              </button>
              <button type="button" onclick="confirmDirectDeleteEmptyChapter('${ch.id}')"
                class="flex-1 py-3 rounded-2xl bg-rose-600 hover:bg-rose-700 text-white font-extrabold text-xs">
                Eliminar
              </button>
            </div>
          </div>
        `);
        return;
      }

      if (!hasBalance && chTxs.length > 0) {
        openModal(`
          <div class="px-5 pt-4 pb-3 border-b border-cream-200 flex items-center justify-between bg-white">
            <h3 class="font-extrabold text-base text-stoneInk-900">Cerrar y eliminar capítulo</h3>
            <button onclick="openChapterModal('${ch.id}')" class="w-8 h-8 rounded-full bg-cream-200 flex items-center justify-center text-stoneInk-700">
              <i class="ph-bold ph-x"></i>
            </button>
          </div>
          <form onsubmit="closeZeroBalanceChapter(event, '${ch.id}')" class="p-5 space-y-4">
            <p class="text-xs text-stoneInk-700 leading-relaxed">
              <strong>"${esc(ch.name)}"</strong> tiene saldo <strong>0,00 €</strong>, pero conserva <strong>${chTxs.length} apuntes</strong>. Seguirá apareciendo en gris hasta su fecha de cierre para que no pierdas su historial.
            </p>

              <label class="block text-xs font-bold text-stoneInk-700 mb-1">Fecha de cierre</label>
              <input type="date" id="zeroCloseDate" value="${defaultDate}" required
                class="w-full bg-white border border-cream-300 rounded-xl px-3 py-2.5 text-xs font-bold text-stoneInk-900" />
            </div>
            <div class="flex gap-2">
              <button type="button" onclick="openChapterModal('${ch.id}')"
                class="flex-1 py-3 rounded-2xl bg-cream-200 text-stoneInk-800 font-extrabold text-xs">
                Cancelar
              </button>
              <button type="submit"
                class="flex-1 py-3 rounded-2xl bg-rose-600 hover:bg-rose-700 text-white font-extrabold text-xs">
                Cerrar y Eliminar
              </button>
            </div>
          </form>
        `);
        return;
      }

      if (otherActiveChapters.length === 0) {
        openModal(`
          <div class="px-5 pt-4 pb-3 border-b border-cream-200 flex items-center justify-between bg-white">
            <h3 class="font-extrabold text-base text-rose-700">Traspaso obligatorio</h3>
            <button onclick="openChapterModal('${ch.id}')" class="w-8 h-8 rounded-full bg-cream-200 flex items-center justify-center text-stoneInk-700">
              <i class="ph-bold ph-x"></i>
            </button>
          </div>
          <div class="p-5 space-y-4">
            <div class="bg-amber-50 border border-amber-200 rounded-2xl p-3.5 text-xs text-stoneInk-800 leading-relaxed">
              <p class="font-extrabold text-amber-900 mb-1">No hay otro capítulo activo de destino</p>
              <p>
                Para eliminar <strong>"${esc(ch.name)}"</strong> (saldo actual: <strong class="font-mono">${fmtEur(ch.annualEndBalance)}</strong>), primero crea otro capítulo al que traspasar ese dinero.
              </p>
            </div>
            <div class="flex gap-2">
              <button type="button" onclick="openChapterModal('${ch.id}')"

                Volver
              </button>
              <button type="button" onclick="openNewChapterModal()"

                + Crear capítulo destino
              </button>
            </div>

      const balText = fmtEur(ch.annualEndBalance);
      const isNegative = ch.annualEndBalance < -0.005;

      openModal(`
        <div class="px-5 pt-4 pb-3 border-b border-cream-200 flex items-center justify-between bg-white">
          <div>
            <span class="text-[10px] font-extrabold uppercase tracking-wider text-rose-600 block">Paso obligatorio antes de eliminar</span>
            <h3 class="font-extrabold text-base text-stoneInk-900">Traspasar saldo y cerrar capítulo</h3>
          </div>
          <button onclick="openChapterModal('${ch.id}')" class="w-8 h-8 rounded-full bg-cream-200 flex items-center justify-center text-stoneInk-700">
            <i class="ph-bold ph-x"></i>
          </button>
        </div>

        <form onsubmit="executeTransferAndCloseChapter(event, '${ch.id}')" class="p-5 space-y-4 overflow-y-auto">
          <div class="bg-amber-50 border border-amber-200 rounded-2xl p-3.5 text-xs text-stoneInk-800 leading-relaxed">
            Para eliminar <strong>"${esc(ch.name)}"</strong>, primero debes traspasar su saldo (<strong class="font-mono ${isNegative ? 'text-terra-600' : 'text-emeraldPro-700'}">${balText}</strong>) a otro capítulo. El capítulo quedará cerrado (en gris) conservando sus datos hasta la fecha.
          </div>

          <div>
            <label class="block text-xs font-bold text-stoneInk-700 mb-1">Traspasar saldo a:</label>
            <select id="delTransferTargetCh" required
              class="w-full bg-white border-2 border-emeraldPro-700 rounded-xl px-3.5 py-3 text-sm font-bold text-stoneInk-900 focus:outline-none">
              <option value="">— Selecciona capítulo destino —</option>
              ${otherActiveChapters.map(c => `
                <option value="${c.id}">
                  ${esc(c.name)} (Actual: ${fmtEur(c.annualEndBalance)} → Final: ${fmtEur(c.annualEndBalance + ch.annualEndBalance)})
                </option>
              `).join('')}
            </select>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-bold text-stoneInk-700 mb-1">Fecha de cierre</label>
              <input type="date" id="delTransferDate" value="${defaultDate}" required
                class="w-full bg-white border border-cream-300 rounded-xl px-3 py-2.5 text-xs font-bold text-stoneInk-900" />
            </div>
            <div>
              <label class="block text-xs font-bold text-stoneInk-700 mb-1">Concepto</label>
              <input type="text" id="delTransferConcept" value="Cierre capítulo ${esc(ch.name)}" required
                class="w-full bg-white border border-cream-300 rounded-xl px-3 py-2.5 text-xs font-semibold text-stoneInk-900" />
            </div>
          </div>

          <div class="pt-1 flex gap-2">
            <button type="button" onclick="openChapterModal('${ch.id}')"
              class="px-4 py-3.5 rounded-2xl bg-cream-200 text-stoneInk-800 font-extrabold text-xs">
              Cancelar
            </button>
            <button type="submit"
              class="flex-1 py-3.5 rounded-2xl bg-rose-600 hover:bg-rose-700 text-white font-extrabold text-xs shadow-md active:scale-[0.98] transition-all">
              Traspasar y Eliminar
            </button>
          </div>
        </form>
      `);
    }

    function confirmDirectDeleteEmptyChapter(chapterId) {
      const book = getActiveBook();
      const ch = book.chapters.find(c => c.id === chapterId);
      if (!ch) return;
      book.chapters = book.chapters.filter(c => c.id !== chapterId);
      if (chronoFilter.chapterId === chapterId) chronoFilter.chapterId = 'all';
      saveState();
      closeModal();
      renderAll();
      showToast(`Capítulo "${ch.name}" eliminado`);
    }

    function closeZeroBalanceChapter(e, chapterId) {
      e.preventDefault();
      const book = getActiveBook();
      const ch = book.chapters.find(c => c.id === chapterId);
      if (!ch) return;
      const date = document.getElementById('zeroCloseDate').value;
      const monthIdx = date && date.length >= 7
        ? Math.max(0, Math.min(11, parseInt(date.split('-')[1], 10) - 1))
        : selectedMonth;

      ch.closed = true;
      ch.closedDate = date;
      ch.closedMonth = monthIdx;
      ch.quota = 0;

      saveState();
      closeModal();
      renderAll();
      showToast(`Capítulo "${ch.name}" cerrado`);
    }

    function executeTransferAndCloseChapter(e, chapterId) {
      e.preventDefault();
      const book = getActiveBook();
      const { chapters } = analyzeBook(book, 11);
      const sourceCh = chapters.find(c => c.id === chapterId);
      const targetId = document.getElementById('delTransferTargetCh').value;
      if (!targetId) {
        showToast('Selecciona un capítulo de destino', 'error');
        return;
      }
      const targetCh = book.chapters.find(c => c.id === targetId);
      const date = document.getElementById('delTransferDate').value;
      const concept = document.getElementById('delTransferConcept').value.trim();

      if (!sourceCh || !targetCh) return;

      const monthIdx = date && date.length >= 7
        ? Math.max(0, Math.min(11, parseInt(date.split('-')[1], 10) - 1))
        : selectedMonth;

      const bal = sourceCh.annualEndBalance;
      const trId = 'tr_close_' + Date.now();

      if (bal > 0) {
        book.transactions.push({
          id: `${trId}_out`,
          transferId: trId,
          type: 'expense',
          chapterId: sourceCh.id,
          amount: Number(bal.toFixed(2)),
          concept: `Traspaso a ${targetCh.name}: ${concept}`,
          note: 'Cierre de capítulo',
          date,
          month: monthIdx
        });
        book.transactions.push({
          id: `${trId}_in`,
          transferId: trId,
          type: 'income',
          source: 'transfer',
          chapterId: targetCh.id,
          amount: Number(bal.toFixed(2)),
          concept: `Traspaso desde ${sourceCh.name}: ${concept}`,
          note: 'Cierre de capítulo',
          date,
          month: monthIdx
        });
      } else if (bal < 0) {
        const absBal = Number(Math.abs(bal).toFixed(2));
        book.transactions.push({
          id: `${trId}_in`,
          transferId: trId,
          type: 'income',
          source: 'transfer',
          chapterId: sourceCh.id,
          amount: absBal,
          concept: `Liquidación desde ${targetCh.name}: ${concept}`,
          note: 'Cierre de capítulo',
          date,
          month: monthIdx
        });
        book.transactions.push({
          id: `${trId}_out`,
          transferId: trId,
          type: 'expense',
          chapterId: targetCh.id,
          amount: absBal,
          concept: `Cobertura cierre ${sourceCh.name}: ${concept}`,
          note: 'Cierre de capítulo',
          date,
          month: monthIdx
        });
      }

      const rawCh = book.chapters.find(c => c.id === sourceCh.id);
      if (rawCh) {
        rawCh.closed = true;
        rawCh.closedDate = date;
        rawCh.closedMonth = monthIdx;
        rawCh.quota = 0;
      }

      saveState();
      closeModal();
      renderAll();
      showToast(`Traspasados ${fmtEur(bal)} a "${targetCh.name}" y cerrado "${sourceCh.name}"`);
    }

          <button type="submit" class="w-full py-3.5 rounded-2xl bg-stoneInk-900 text-white font-extrabold text-sm">
            Guardar Saldo Inicial

        </form>
      `);
