<body class="font-sans antialiased selection:bg-emeraldPro-100 selection:text-emeraldPro-700">

  <div id="app" class="max-w-4xl mx-auto min-h-screen flex flex-col">

    <!-- CABECERA COMPACTA: Selector de Bloque (Personal/Hogar), Selector de Año y Ajustes -->
    <header class="sticky top-0 z-30 bg-cream-100/95 backdrop-blur-md border-b border-cream-300 px-3.5 py-2.5">
      <div class="flex items-center justify-between gap-2">
        <!-- Grupo izquierdo: Selector de Bloque + Selector rápido de Año -->
        <div class="flex items-center gap-1.5 min-w-0">
          <button onclick="openWorkspaceModal()"
            class="flex items-center gap-2 bg-white hover:bg-cream-50 active:scale-[0.98] transition-all border border-cream-300 rounded-2xl px-3 py-2 shadow-sm min-w-0 text-left">
            <div id="headerCategoryIcon" class="w-8 h-8 rounded-lg bg-emeraldPro-700 text-white flex items-center justify-center shrink-0">
              <i class="ph-bold ph-user text-base"></i>
            </div>
            <div class="min-w-0">
              <span class="text-[10px] font-bold uppercase tracking-wider text-stoneInk-400 block leading-none">Bloque</span>
              <div class="flex items-center gap-1 mt-0.5">
                <span id="headerCategoryLabel" class="font-extrabold text-sm text-stoneInk-900 truncate">Personal</span>
                <i class="ph-bold ph-caret-down text-[11px] text-stoneInk-500 shrink-0"></i>
              </div>
            </div>
          </button>

          <!-- Selector rápido de Año del bloque activo -->
          <div class="bg-white border border-cream-300 rounded-2xl px-2.5 py-2 shadow-sm shrink-0">
            <span class="text-[10px] font-bold uppercase tracking-wider text-stoneInk-400 block leading-none">Año</span>
            <select id="headerYearSelect" onchange="selectYearInCategory(this.value)"
              class="mt-0.5 bg-transparent font-mono font-extrabold text-sm text-stoneInk-900 focus:outline-none cursor-pointer pr-1">
            </select>
          </div>
        </div>

        <!-- Grupo derecho: Botón Ajustes -->
        <button onclick="openSettingsModal()" aria-label="Ajustes y respaldo"
          class="w-10 h-10 rounded-xl bg-white hover:bg-cream-200/60 border border-cream-300 flex items-center justify-center text-stoneInk-700 transition-all active:scale-95 shrink-0">
          <i class="ph-bold ph-gear-six text-lg"></i>
        </button>
      </div>
    </header>

    <!-- CONTENIDO DE LAS 4 VISTAS -->
    <main class="flex-1 px-4 pt-4 pb-safe">
      <!-- Vista 1: Capítulos -->
      <section id="view-chapters"></section>

      <!-- Vista 2: Tabla Anual -->
      <section id="view-table" class="hidden"></section>

      <!-- Vista 3: Cronológico (Buscador + Desplegables compactos + KPI en una línea) -->
      <section id="view-chrono" class="hidden space-y-3">
        <div class="bg-white border border-cream-300 rounded-2xl p-3.5 shadow-sm space-y-2.5">
          <!-- Buscador + Botón Limpiar -->
          <div class="flex items-center gap-2">
            <div class="relative flex-1">
              <i class="ph-bold ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-stoneInk-400 text-base"></i>
              <input id="chronoSearchInput" type="search" autocomplete="off"
                placeholder="Buscar concepto, nota o importe..."
                class="w-full bg-cream-100 border border-cream-300 focus:border-emeraldPro-700 focus:bg-white rounded-xl pl-9 pr-3 py-2 text-sm text-stoneInk-900 placeholder:text-stoneInk-400 focus:outline-none transition-colors" />
            </div>

            <button onclick="clearChronoFilters()"
              class="bg-terra-50 hover:bg-terra-100 text-terra-600 border border-terra-600/20 rounded-xl py-2 px-3 text-xs font-extrabold flex items-center gap-1 transition-all active:scale-95 shrink-0">
              <i class="ph-bold ph-broom text-sm"></i>
              <span>Limpiar</span>
            </button>
          </div>

          <!-- 3 Desplegables en fila: Capítulo, Mes y Tipo (incluye Traspasos) -->
          <div class="grid grid-cols-3 gap-2">
            <select id="chronoChapterSelect"
              class="bg-cream-100 border border-cream-300 rounded-xl px-2 py-2 text-xs font-bold text-stoneInk-800 focus:outline-none truncate">
              <option value="all">Todos cap.</option>
            </select>

            <select id="chronoMonthSelect"
              class="bg-cream-100 border border-cream-300 rounded-xl px-2 py-2 text-xs font-bold text-stoneInk-800 focus:outline-none">
              <option value="all">Todos meses</option>
            </select>

            <select id="chronoTypeSelect"
              class="bg-cream-100 border border-cream-300 rounded-xl px-2 py-2 text-xs font-bold text-stoneInk-800 focus:outline-none">
              <option value="all">Todo tipo</option>
              <option value="expense">Gastos</option>
              <option value="income">Ingresos</option>
              <option value="transfer">Traspasos</option>
            </select>
          </div>
        </div>

        <!-- KPI Sumatorio en una única línea visual -->
        <div id="chrono-kpi"></div>

        <!-- Listado de movimientos -->
        <div id="chrono-results" class="space-y-2"></div>
      </section>

      <!-- Vista 4: Gráficos -->
      <section id="view-charts" class="hidden space-y-4"></section>
    </main>

    <!-- NAVEGACIÓN INFERIOR (4 PESTAÑAS) -->
    <nav class="fixed bottom-0 inset-x-0 z-30 bg-white/95 backdrop-blur-md border-t border-cream-300 nav-safe">
      <div class="max-w-4xl mx-auto grid grid-cols-4 px-1 pt-1.5">
        <button onclick="switchView('chapters')" id="tab-chapters"
          class="flex flex-col items-center justify-center py-1.5 rounded-xl transition-colors text-emeraldPro-700">
          <i class="ph-fill ph-folders text-2xl"></i>
          <span class="text-[11px] font-extrabold mt-0.5">Capítulos</span>
        </button>

        <button onclick="switchView('table')" id="tab-table"
          class="flex flex-col items-center justify-center py-1.5 rounded-xl transition-colors text-stoneInk-500">
          <i class="ph-bold ph-table text-2xl"></i>
          <span class="text-[11px] font-semibold mt-0.5">Tabla Anual</span>
        </button>

        <button onclick="switchView('chrono')" id="tab-chrono"
          class="flex flex-col items-center justify-center py-1.5 rounded-xl transition-colors text-stoneInk-500">
          <i class="ph-bold ph-list-bullets text-2xl"></i>
          <span class="text-[11px] font-semibold mt-0.5">Cronológico</span>
        </button>

        <button onclick="switchView('charts')" id="tab-charts"
          class="flex flex-col items-center justify-center py-1.5 rounded-xl transition-colors text-stoneInk-500">
          <i class="ph-bold ph-chart-pie-slice text-2xl"></i>
          <span class="text-[11px] font-semibold mt-0.5">Gráficos</span>
        </button>
      </div>
    </nav>
  </div>

    function buildInitialState() {
      const personalYears = Object.keys(PERSONAL_2019_2026).sort((a, b) => Number(b) - Number(a));
      const personalBooks = personalYears.map(yr => {
        const entry = PERSONAL_2019_2026[yr];
        return {
          id: `personal_${yr}`,
          category: 'personal',
          year: Number(yr),
          chapters: entry.chapters.map(c => ({
            ...c,
            closed: false,
            closedDate: null,
            closedMonth: null
          })),
          transactions: entry.transactions.map(t => ({ ...t }))
        };
      });

      const hogarYears = Object.keys(HOGAR_2022_2026).sort((a, b) => Number(b) - Number(a));
      const hogarBooks = hogarYears.map(yr => {
        const entry = HOGAR_2022_2026[yr];
        return {
          id: `hogar_${yr}`,
          category: 'hogar',
          year: Number(yr),
          chapters: entry.chapters.map(c => ({
            ...c,
            closed: false,
            closedDate: null,
            closedMonth: null
          })),
          transactions: entry.transactions.map(t => ({ ...t }))
        };
      });

      return {
        activeCategory: 'personal',
        activeBookId: personalBooks[0]?.id || 'personal_2026',
        books: [...personalBooks, ...hogarBooks]
      };
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.books) && parsed.books.length > 0) {
            return parsed;
          }
        }
      } catch (e) {
        console.error('Error leyendo localStorage:', e);
      }
      const fresh = buildInitialState();
      saveState(fresh);
      return fresh;
    }

    function saveState(target = state) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(target));
      } catch (e) {
        console.error('Error guardando estado:', e);
      }
    }

    function getBooksByCategory(cat) {
      return state.books
        .filter(b => b.category === cat)
        .sort((a, b) => b.year - a.year);
    }

    function getActiveBook() {
      let b = state.books.find(x => x.id === state.activeBookId);
      if (!b) {
        const list = getBooksByCategory(state.activeCategory);
        b = list[0] || state.books[0];
        state.activeBookId = b.id;
        state.activeCategory = b.category;
      }
      return b;
    }

    /**
     * Devuelve los capítulos ordenados alfabéticamente (activos primero alfabéticamente,
     * y cerrados/eliminados alfabéticamente después).
     */
    function getSortedChapters(chapters) {
      return [...chapters].sort((a, b) => {
        const aClosed = Boolean(a.closed);
        const bClosed = Boolean(b.closed);
        if (aClosed !== bClosed) return aClosed ? 1 : -1;
        return (a.name || '').localeCompare(b.name || '', 'es', { sensitivity: 'base' });
      });
    }

    // =========================================================================
    // 3. FORMATEO Y CÁLCULOS FINANCIEROS (ACUMULADO A MES VENCIDO)
    // =========================================================================
    function fmtEur(num) {
      const val = Number(num) || 0;
      return val.toLocaleString('es-ES', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }) + ' €';
    }

    function fmtCell(num) {
      const val = Number(num) || 0;
      if (Math.abs(val) < 0.005) return '—';
      return val.toLocaleString('es-ES', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    function getTxMonth(tx) {
      if (typeof tx.month === 'number' && tx.month >= 0 && tx.month <= 11) {
        return tx.month;
      }
      if (tx.date && tx.date.length >= 7) {
        const m = parseInt(tx.date.split('-')[1], 10) - 1;
        return isNaN(m) ? 0 : Math.max(0, Math.min(11, m));
      }
      return 0;
    }

    function fmtDateShort(dateStr) {
      if (!dateStr) return '';
      const p = dateStr.split('-');
      if (p.length !== 3) return dateStr;
      return `${p[2]} ${MONTHS_SHORT[parseInt(p[1], 10) - 1]}`;
    }

    /**
     * Calcula los saldos de cada capítulo ordenados alfabéticamente:
     * - monthStartBalance: saldo al inicio del mes `targetMonth`
     * - balanceAtMonthEnd: saldo acumulado al cierre del mes `targetMonth` (mes vencido)
     * - annualEndBalance: saldo acumulado al cierre del año completo (Diciembre)
     */
    function analyzeBook(book, targetMonth = selectedMonth) {
      const sortedRawChapters = getSortedChapters(book.chapters);

      const chapters = sortedRawChapters.map(ch => {
        const txs = book.transactions.filter(t => t.chapterId === ch.id);
        const byMonth = Array.from({ length: 12 }, () => ({
          income: 0,
          salaryIncome: 0,
          expense: 0,
          incomeTxs: [],
          expenseTxs: []
        }));

        let totalIncome = 0;
        let totalExpense = 0;

        txs.forEach(t => {
          const m = getTxMonth(t);
          const amt = Number(t.amount) || 0;
          if (t.type === 'income') {
            totalIncome += amt;
            byMonth[m].income += amt;
            if (t.source === 'salary') {
              byMonth[m].salaryIncome += amt;
            }
            byMonth[m].incomeTxs.push(t);
          } else {
            totalExpense += amt;
            byMonth[m].expense += amt;
            byMonth[m].expenseTxs.push(t);
          }
        });

        const initBal = Number(ch.initialBalance) || 0;

        let monthStartBalance = initBal;
        for (let m = 0; m < targetMonth; m++) {
          monthStartBalance += byMonth[m].income - byMonth[m].expense;
        }

        const monthIncome = byMonth[targetMonth].income;
        const monthSalaryIncome = byMonth[targetMonth].salaryIncome;
        const monthExpense = byMonth[targetMonth].expense;

        const balanceAtMonthEnd = Number((monthStartBalance + monthIncome - monthExpense).toFixed(2));
        const annualEndBalance = Number((initBal + totalIncome - totalExpense).toFixed(2));

        return {
          ...ch,
          closed: Boolean(ch.closed),
          closedDate: ch.closedDate || null,
          closedMonth: typeof ch.closedMonth === 'number' ? ch.closedMonth : null,
          initialBalance: Number(initBal.toFixed(2)),
          quota: Number((Number(ch.quota) || 0).toFixed(2)),
          totalIncome: Number(totalIncome.toFixed(2)),
          totalExpense: Number(totalExpense.toFixed(2)),
          monthStartBalance: Number(monthStartBalance.toFixed(2)),
          monthIncome: Number(monthIncome.toFixed(2)),
          monthSalaryIncome: Number(monthSalaryIncome.toFixed(2)),
          monthExpense: Number(monthExpense.toFixed(2)),
          balanceAtMonthEnd,
          annualEndBalance,
          byMonth
        };
      });

      const summary = {
        totalInitial: chapters.reduce((s, c) => s + c.initialBalance, 0),
        totalIncome: chapters.reduce((s, c) => s + c.totalIncome, 0),
        totalExpense: chapters.reduce((s, c) => s + c.totalExpense, 0),
        totalAtMonthEnd: chapters.reduce((s, c) => s + c.balanceAtMonthEnd, 0),
        totalAnnualEnd: chapters.reduce((s, c) => s + c.annualEndBalance, 0),
        monthIncomeTotal: chapters.reduce((s, c) => s + c.monthIncome, 0),
        monthExpenseTotal: chapters.reduce((s, c) => s + c.monthExpense, 0),
        monthlyIncome: Array.from({ length: 12 }, (_, m) => chapters.reduce((s, c) => s + c.byMonth[m].income, 0)),
        monthlyExpense: Array.from({ length: 12 }, (_, m) => chapters.reduce((s, c) => s + c.byMonth[m].expense, 0))
      };

      return { chapters, summary };
    }

    // =========================================================================
    // 4. NAVEGACIÓN Y RENDERIZADO DE CABECERA
    // =========================================================================
    function switchView(view) {
      currentView = view;
      ['chapters', 'table', 'chrono', 'charts'].forEach(v => {
        const sec = document.getElementById('view-' + v);
        const tab = document.getElementById('tab-' + v);
        const icon = tab.querySelector('i');
        const label = tab.querySelector('span');

        if (v === view) {
          sec.classList.remove('hidden');
          tab.classList.remove('text-stoneInk-500');
          tab.classList.add('text-emeraldPro-700');
          icon.classList.remove('ph-bold');
          icon.classList.add('ph-fill');
          label.classList.replace('font-semibold', 'font-extrabold');
        } else {
          sec.classList.add('hidden');
          tab.classList.add('text-stoneInk-500');
          tab.classList.remove('text-emeraldPro-700');
          icon.classList.add('ph-bold');
          icon.classList.remove('ph-fill');
          label.classList.replace('font-extrabold', 'font-semibold');
        }
      });
      renderAll();
    }

    function renderHeader() {
      const book = getActiveBook();
      const isPersonal = book.category === 'personal';

      document.getElementById('headerCategoryLabel').textContent = isPersonal ? 'Personal' : 'Hogar';
      const iconBox = document.getElementById('headerCategoryIcon');
      iconBox.className = `w-8 h-8 rounded-lg text-white flex items-center justify-center shrink-0 ${
        isPersonal ? 'bg-emeraldPro-700' : 'bg-terra-600'
      }`;
      iconBox.innerHTML = `<i class="ph-bold ${isPersonal ? 'ph-user' : 'ph-house-line'} text-base"></i>`;

      const catBooks = getBooksByCategory(book.category);
      const yearSelect = document.getElementById('headerYearSelect');
      yearSelect.innerHTML = catBooks.map(b => `
        <option value="${b.id}" ${b.id === book.id ? 'selected' : ''}>${b.year}</option>
      `).join('');
    }

    function selectYearInCategory(bookId) {
      state.activeBookId = bookId;
      const b = getActiveBook();
      state.activeCategory = b.category;
      chronoFilter.chapterId = 'all';
      saveState();
      renderAll();
    }

    function renderAll() {
      renderHeader();
      if (currentView === 'chapters') {
        renderChaptersView();
      } else if (currentView === 'table') {
        renderTableView();
      } else if (currentView === 'chrono') {
        renderChronoDropdowns();
        renderChronoListAndKPI();
      } else if (currentView === 'charts') {
        renderChartsView();
      }

    // =========================================================================

    function changeSelectedMonth(delta) {
      selectedMonth = (selectedMonth + delta + 12) % 12;
      renderChaptersView();
    }

    function setSelectedMonth(m) {
      selectedMonth = parseInt(m, 10);
      renderChaptersView();
    }

    // =========================================================================
    // 7. VISTA 3: CRONOLÓGICO (DESPLEGABLES + KPI EN UNA SOLA LÍNEA)
    // =========================================================================
    function initChronoListeners() {
      const searchInput = document.getElementById('chronoSearchInput');
      const chapterSelect = document.getElementById('chronoChapterSelect');
      const monthSelect = document.getElementById('chronoMonthSelect');
      const typeSelect = document.getElementById('chronoTypeSelect');

      MONTHS_FULL.forEach((m, idx) => {
        const opt = document.createElement('option');
        opt.value = String(idx);
        opt.textContent = m;
        monthSelect.appendChild(opt);
      });

      searchInput.addEventListener('input', (e) => {
        chronoFilter.search = e.target.value;
        renderChronoListAndKPI();
      });

      chapterSelect.addEventListener('change', (e) => {
        chronoFilter.chapterId = e.target.value;
        renderChronoListAndKPI();
      });

      monthSelect.addEventListener('change', (e) => {
        chronoFilter.month = e.target.value;
        renderChronoListAndKPI();
      });

      typeSelect.addEventListener('change', (e) => {
        chronoFilter.type = e.target.value;
        renderChronoListAndKPI();
      });
    }

    function renderChronoDropdowns() {
      const book = getActiveBook();
      const sortedChs = getSortedChapters(book.chapters);
      const chSelect = document.getElementById('chronoChapterSelect');
      chSelect.innerHTML = `<option value="all">Todos cap.</option>` +
        sortedChs.map(c => `<option value="${c.id}">${esc(c.name)}${c.closed ? ' (Cerrado)' : ''}</option>`).join('');

      if (!book.chapters.some(c => c.id === chronoFilter.chapterId)) {
        chronoFilter.chapterId = 'all';
      }
      chSelect.value = chronoFilter.chapterId;
      document.getElementById('chronoMonthSelect').value = chronoFilter.month;
      document.getElementById('chronoTypeSelect').value = chronoFilter.type;
    }

    function clearChronoFilters() {
      chronoFilter = { search: '', chapterId: 'all', month: 'all', type: 'all' };
      document.getElementById('chronoSearchInput').value = '';
      renderChronoDropdowns();
      renderChronoListAndKPI();
      showToast('Filtros limpiados');
    }

    function renderChronoListAndKPI() {
      const book = getActiveBook();
      const chMap = Object.fromEntries(book.chapters.map(c => [c.id, c]));

      const filtered = book.transactions.filter(tx => {
        if (chronoFilter.chapterId !== 'all' && tx.chapterId !== chronoFilter.chapterId) return false;
        if (chronoFilter.month !== 'all' && getTxMonth(tx) !== parseInt(chronoFilter.month, 10)) return false;

        if (chronoFilter.type !== 'all') {
          if (chronoFilter.type === 'transfer') {
            if (!tx.transferId) return false;
          } else if (tx.type !== chronoFilter.type) {
            return false;
          }
        }

        if (chronoFilter.search.trim() !== '') {
          const q = chronoFilter.search.toLowerCase().trim();
          const concept = (tx.concept || '').toLowerCase();
          const note = (tx.note || '').toLowerCase();
          const chName = (chMap[tx.chapterId]?.name || '').toLowerCase();
          const amtComma = String(tx.amount).replace('.', ',');
          if (!concept.includes(q) && !note.includes(q) && !chName.includes(q) && !amtComma.includes(q) && !String(tx.amount).includes(q)) {
            return false;
          }
        }
        return true;
      });

      filtered.sort((a, b) => (b.date || '').localeCompare(a.date || ''));

      const sumIncome = filtered.filter(t => t.type === 'income').reduce((s, t) => s + (Number(t.amount) || 0), 0);
      const sumExpense = filtered.filter(t => t.type === 'expense').reduce((s, t) => s + (Number(t.amount) || 0), 0);
      const netSum = sumIncome - sumExpense;

      const mainKpiValue = chronoFilter.type === 'expense'
        ? '-' + fmtEur(sumExpense)
        : chronoFilter.type === 'income'
          ? '+' + fmtEur(sumIncome)
          : fmtEur(netSum);

      const mainKpiColor = chronoFilter.type === 'expense'
        ? 'text-orange-300'
        : chronoFilter.type === 'income'
          ? 'text-emerald-400'
          : netSum < -0.005 ? 'text-rose-400' : 'text-white';

      document.getElementById('chrono-kpi').innerHTML = `
        <div class="bg-stoneInk-900 text-white rounded-2xl p-3.5 shadow-sm flex items-center justify-between gap-2">
          <div class="min-w-0">
            <span class="text-[10px] uppercase tracking-wider text-stoneInk-400 font-bold block truncate">
              Sumatorio (${filtered.length} apuntes)
            </span>
            <span class="font-mono text-lg sm:text-xl font-extrabold tabular-nums whitespace-nowrap mt-0.5 block ${mainKpiColor}">
              ${mainKpiValue}
            </span>
          </div>

          <div class="flex items-center gap-3 text-right font-mono tabular-nums shrink-0">
            <div>
              <span class="text-[10px] font-sans text-stoneInk-400 block">Ingresos</span>
              <span class="text-xs font-bold text-emerald-400 whitespace-nowrap">+${fmtEur(sumIncome)}</span>
            </div>
            <div>
              <span class="text-[10px] font-sans text-stoneInk-400 block">Gastos</span>
              <span class="text-xs font-bold text-orange-300 whitespace-nowrap">-${fmtEur(sumExpense)}</span>
            </div>
          </div>
        </div>
      `;

      const resultsBox = document.getElementById('chrono-results');
      if (filtered.length === 0) {
        resultsBox.innerHTML = `
          <div class="bg-white border border-cream-300 rounded-2xl p-8 text-center">
            <i class="ph-duotone ph-magnifying-glass text-4xl text-stoneInk-400"></i>
            <p class="text-sm font-bold text-stoneInk-700 mt-2">No hay apuntes con estos filtros</p>
            <button onclick="clearChronoFilters()" class="mt-3 text-xs font-extrabold text-terra-600 underline">
              Limpiar filtros
            </button>
          </div>
        `;
        return;
      }

      resultsBox.innerHTML = filtered.map(tx => {
        const ch = chMap[tx.chapterId] || { name: 'Capítulo' };
        const isInc = tx.type === 'income';
        const isTransfer = Boolean(tx.transferId);

        return `
          <div onclick="openTxModal('${tx.id}')"
            class="bg-white hover:bg-cream-50 active:scale-[0.99] transition-all border border-cream-300 rounded-2xl p-3.5 flex items-center justify-between gap-3 cursor-pointer shadow-sm">
            <div class="flex items-center gap-3 min-w-0">
              <div class="w-10 h-10 rounded-xl flex items-center justify-center shrink-0 ${
                isTransfer
                  ? 'bg-sky-50 text-sky-700'
                  : isInc ? 'bg-emeraldPro-50 text-emeraldPro-700' : 'bg-terra-50 text-terra-600'
              }">
                <i class="ph-bold ${
                  isTransfer
                    ? 'ph-arrows-left-right'
                    : isInc ? 'ph-arrow-down-left' : 'ph-arrow-up-right'
                } text-lg"></i>
              </div>
              <div class="min-w-0">
                <p class="text-sm font-bold text-stoneInk-900 truncate">${esc(tx.concept)}</p>
                ${tx.note ? `<p class="text-xs text-stoneInk-500 truncate">${esc(tx.note)}</p>` : ''}
                <div class="flex items-center gap-2 mt-1">
                  <span class="text-[10px] font-extrabold bg-cream-200 text-stoneInk-700 px-2 py-0.5 rounded-md">
                    ${esc(ch.name)}${ch.closed ? ' · Cerrado' : ''}
                  </span>
                  <span class="text-[11px] font-medium text-stoneInk-400">${fmtDateShort(tx.date)}</span>
                </div>
              </div>
            </div>

            <span class="font-mono text-sm sm:text-base font-extrabold tabular-nums whitespace-nowrap shrink-0 ${
              isInc ? 'text-emeraldPro-700' : 'text-terra-600'
            }">
              ${isInc ? '+' : '-'}${fmtEur(tx.amount)}
            </span>
          </div>
        `;
      }).join('');
    }

    // =========================================================================
    // 7B. VISTA 4: GRÁFICOS ANALÍTICOS (100% OFFLINE SVG INTERACTIVO)
    // =========================================================================
    function setChartDonutMode(mode) {
      chartDonutMode = mode;
      renderChartsView();
    }

    function setChartDonutMonth(m) {
      chartDonutMonth = parseInt(m, 10);
      chartDonutMode = 'month_expense';
      renderChartsView();
    }

    function inspectChartMonth(m) {
      chartInspectMonth = (chartInspectMonth === m) ? null : m;
      renderChartsView();
    }

    function renderChartsView() {
      const book = getActiveBook();
      const { chapters, summary } = analyzeBook(book, chartDonutMonth);

      if (chapters.length === 0) {
        document.getElementById('view-charts').innerHTML = `
          <div class="bg-white border border-cream-300 rounded-2xl p-8 text-center">
            <i class="ph-duotone ph-chart-pie-slice text-4xl text-stoneInk-400"></i>
            <p class="text-sm font-bold text-stoneInk-700 mt-2">Aún no hay datos en ${book.year}</p>
            <p class="text-xs text-stoneInk-500 mt-1">Añade capítulos y movimientos para visualizar tus gráficos.</p>
          </div>
        `;
        return;
      }

      // 1. KPIs Anuales rápidos (Saldo actual = saldo acumulado final)
      let peakMonthIdx = 0;
      let peakMonthVal = 0;
      summary.monthlyExpense.forEach((v, idx) => {
        if (v > peakMonthVal) {
          peakMonthVal = v;
          peakMonthIdx = idx;
        }
      });

      // 2. Gráfico combinado interactivo: Barras (Ingresos vs Gastos) + Línea (Saldo Acumulado)
      let runningBal = summary.totalInitial;
      const cumulativeByMonth = Array.from({ length: 12 }, (_, m) => {
        runningBal += summary.monthlyIncome[m] - summary.monthlyExpense[m];
        return Number(runningBal.toFixed(2));
      });

      const allVals = [
        ...summary.monthlyIncome,
        ...summary.monthlyExpense,
        ...cumulativeByMonth,
        0
      ];
      const maxVal = Math.max(...allVals, 100);
      const minVal = Math.min(...allVals, 0);
      const span = Math.max(maxVal - minVal, 1);

      const svgW = 680;
      const svgH = 235;
      const padL = 14;
      const padR = 14;
      const padT = 22;
      const padB = 28;
      const plotW = svgW - padL - padR;
      const plotH = svgH - padT - padB;
      const colStep = plotW / 12;

      const yScale = (val) => padT + ((maxVal - val) / span) * plotH;
      const yZero = yScale(0);

      let highlightSvg = '';
      let barsSvg = '';
      let linePoints = [];
      let dotsSvg = '';
      let labelsSvg = '';
      let hitZonesSvg = '';

      for (let m = 0; m < 12; m++) {
        const colLeft = padL + m * colStep;
        const cx = colLeft + colStep / 2;
        const inc = summary.monthlyIncome[m];
        const exp = summary.monthlyExpense[m];
        const cum = cumulativeByMonth[m];
        const isInspected = chartInspectMonth === m;

        if (isInspected) {
          highlightSvg += `
            <rect x="${(colLeft + 3).toFixed(1)}" y="${padT - 8}" width="${(colStep - 6).toFixed(1)}" height="${(plotH + 30).toFixed(1)}" rx="10" fill="#F0FDFA" stroke="#0F766E" stroke-width="1.5" />
          `;
        }

        const barW = Math.min(14, colStep * 0.28);
        const yInc = yScale(inc);
        const hInc = Math.max(0, yZero - yInc);
        const yExp = yScale(exp);
        const hExp = Math.max(0, yZero - yExp);

        barsSvg += `
          <rect x="${(cx - barW - 1.5).toFixed(1)}" y="${yInc.toFixed(1)}" width="${barW.toFixed(1)}" height="${hInc.toFixed(1)}" rx="3" fill="#0F766E" opacity="0.9" />
          <rect x="${(cx + 1.5).toFixed(1)}" y="${yExp.toFixed(1)}" width="${barW.toFixed(1)}" height="${hExp.toFixed(1)}" rx="3" fill="#EA580C" opacity="0.9" />
        `;

        const yCum = yScale(cum);
        linePoints.push(`${cx.toFixed(1)},${yCum.toFixed(1)}`);
        dotsSvg += `
          <circle cx="${cx.toFixed(1)}" cy="${yCum.toFixed(1)}" r="${isInspected ? 6.5 : 4.2}" fill="${isInspected ? '#0F766E' : '#1C1917'}" stroke="#FFFFFF" stroke-width="2" />
        `;

        labelsSvg += `
          <text x="${cx.toFixed(1)}" y="${svgH - 8}" text-anchor="middle" font-size="11" font-weight="${isInspected ? '800' : '700'}" fill="${isInspected ? '#0F766E' : '#78716C'}">
            ${MONTHS_SHORT[m]}
          </text>
        `;

        hitZonesSvg += `
          <rect x="${colLeft.toFixed(1)}" y="0" width="${colStep.toFixed(1)}" height="${svgH}" fill="transparent" class="cursor-pointer" onclick="inspectChartMonth(${m})" />
        `;
      }

      const comboChartSvg = `
        <svg viewBox="0 0 ${svgW} ${svgH}" class="w-full h-auto overflow-visible select-none">
          ${highlightSvg}
          <line x1="${padL}" y1="${yZero.toFixed(1)}" x2="${svgW - padR}" y2="${yZero.toFixed(1)}" stroke="#E2DDD2" stroke-width="1.5" stroke-dasharray="4 3" />
          ${barsSvg}
          <polyline fill="none" stroke="#1C1917" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" points="${linePoints.join(' ')}" />
          ${dotsSvg}
          ${labelsSvg}
          ${hitZonesSvg}
        </svg>
      `;

      const inspectedBannerHtml = chartInspectMonth !== null
        ? `
          <div class="bg-stoneInk-900 text-white rounded-2xl p-3 flex flex-wrap items-center justify-between gap-2 text-xs animate-fade">
            <div class="flex items-center gap-2">
              <span class="bg-emeraldPro-600 text-white font-extrabold px-2 py-0.5 rounded-lg">${MONTHS_FULL[chartInspectMonth]}</span>
              <span class="text-stoneInk-300 font-semibold">Detalle del mes:</span>
            </div>
            <div class="flex items-center gap-3 font-mono tabular-nums">
              <span class="text-emerald-400 font-bold">Ing: +${fmtEur(summary.monthlyIncome[chartInspectMonth])}</span>
              <span class="text-orange-300 font-bold">Gtos: -${fmtEur(summary.monthlyExpense[chartInspectMonth])}</span>
              <span class="text-white font-extrabold">Acum: ${fmtEur(cumulativeByMonth[chartInspectMonth])}</span>
            </div>
          </div>
        `
        : `
          <p class="text-[11px] text-stoneInk-400 text-center">
            Toca cualquier mes en el gráfico para ver sus cifras exactas de ingresos, gastos y acumulado
          </p>
        `;

      // 3. Gráfico Donut / Tarta por Capítulos con paleta diferenciada y selector de mes
      let donutTitle = '';
      let rawSlices = [];

      if (chartDonutMode === 'month_expense') {
        donutTitle = `Gastos en ${MONTHS_FULL[chartDonutMonth]} (${book.year})`;
        rawSlices = chapters
          .map((c, idx) => ({ name: c.name, value: Math.max(0, Number(c.monthExpense.toFixed(2))), color: CHART_PALETTE[idx % CHART_PALETTE.length] }))
          .filter(s => s.value > 0.005);
      } else {
        donutTitle = `Gastos acumulados en ${book.year}`;
        rawSlices = chapters
          .map((c, idx) => ({ name: c.name, value: Math.max(0, c.totalExpense), color: CHART_PALETTE[idx % CHART_PALETTE.length] }))
          .filter(s => s.value > 0.005);
      }

      rawSlices.sort((a, b) => b.value - a.value);
      const donutTotal = rawSlices.reduce((s, x) => s + x.value, 0);

      let donutHtml = '';
      if (donutTotal <= 0.005) {
        donutHtml = `
          <div class="py-10 text-center text-xs text-stoneInk-500">
            No hay importes positivos para graficar en esta selección.
          </div>
        `;
      } else {
        const r = 64;
        const circumference = 2 * Math.PI * r;
        let offset = 0;

        const circlesSvg = rawSlices.map(sl => {
          const pct = sl.value / donutTotal;
          const dash = pct * circumference;
          const seg = `
            <circle cx="85" cy="85" r="${r}" fill="transparent"
              stroke="${sl.color}" stroke-width="24"
              stroke-dasharray="${dash.toFixed(2)} ${circumference.toFixed(2)}"
              stroke-dashoffset="${(-offset).toFixed(2)}" />
          `;
          offset += dash;
          return seg;
        }).join('');

        const legendHtml = rawSlices.map(sl => {
          const pct = ((sl.value / donutTotal) * 100).toFixed(1).replace('.', ',');
          return `
            <div class="flex items-center justify-between gap-2 py-1.5 border-b border-cream-200 last:border-0 text-xs">
              <div class="flex items-center gap-2 min-w-0">
                <span class="w-3 h-3 rounded-full shrink-0" style="background-color:${sl.color}"></span>
                <span class="font-bold text-stoneInk-800 truncate">${esc(sl.name)}</span>
              </div>
              <div class="flex items-center gap-2 font-mono tabular-nums shrink-0">
                <span class="text-[11px] text-stoneInk-500">${pct}%</span>
                <strong class="text-stoneInk-900">${fmtEur(sl.value)}</strong>
              </div>
            </div>
          `;
        }).join('');

        donutHtml = `
          <div class="flex flex-col sm:flex-row items-center gap-5 pt-2">
            <div class="relative w-44 h-44 shrink-0 flex items-center justify-center">
              <svg viewBox="0 0 170 170" class="w-full h-full -rotate-90">
                ${circlesSvg}
              </svg>
              <div class="absolute inset-0 flex flex-col items-center justify-center text-center px-4">
                <span class="text-[10px] font-bold uppercase text-stoneInk-400">Total</span>
                <span class="font-mono text-xs font-extrabold text-stoneInk-900 tabular-nums mt-0.5">${fmtEur(donutTotal)}</span>
              </div>
            </div>

            <div class="w-full flex-1 max-h-56 overflow-y-auto pr-1">
              ${legendHtml}
            </div>
          </div>
        `;
      }

      document.getElementById('view-charts').innerHTML = `
        <!-- 1. Tarjetas Resumen Anual -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
          <div class="bg-white border border-cream-300 rounded-2xl p-3 shadow-sm">
            <span class="text-[10px] font-bold uppercase text-stoneInk-400 block">Ingresos ${book.year}</span>
            <span class="font-mono text-sm sm:text-base font-extrabold text-emeraldPro-700 tabular-nums mt-0.5 block">
              +${fmtEur(summary.totalIncome)}
            </span>
          </div>
          <div class="bg-white border border-cream-300 rounded-2xl p-3 shadow-sm">
            <span class="text-[10px] font-bold uppercase text-stoneInk-400 block">Gastos ${book.year}</span>
            <span class="font-mono text-sm sm:text-base font-extrabold text-terra-600 tabular-nums mt-0.5 block">
              -${fmtEur(summary.totalExpense)}
            </span>
          </div>
          <div class="bg-white border border-cream-300 rounded-2xl p-3 shadow-sm">
            <span class="text-[10px] font-bold uppercase text-stoneInk-400 block">Saldo actual</span>
            <span class="font-mono text-sm sm:text-base font-extrabold tabular-nums mt-0.5 block ${summary.totalAnnualEnd < -0.005 ? 'text-terra-600' : 'text-emeraldPro-700'}">
              ${fmtEur(summary.totalAnnualEnd)}
            </span>
          </div>
          <div class="bg-white border border-cream-300 rounded-2xl p-3 shadow-sm">
            <span class="text-[10px] font-bold uppercase text-stoneInk-400 block">Mes Mayor Gasto</span>
            <span class="text-xs sm:text-sm font-extrabold text-stoneInk-900 mt-0.5 block">
              ${peakMonthVal > 0 ? `${MONTHS_SHORT[peakMonthIdx]} (${fmtEur(peakMonthVal)})` : '—'}
            </span>
          </div>
        </div>

        <!-- 2. Gráfico Barras + Línea: Evolución Mensual -->
        <div class="bg-white border border-cream-300 rounded-2xl p-4 shadow-sm space-y-3">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <div>
              <h3 class="font-extrabold text-sm text-stoneInk-900">Evolución Mensual (${book.year})</h3>
              <p class="text-[11px] text-stoneInk-500">Ingresos y gastos por mes frente al saldo acumulado</p>
            </div>
            <div class="flex items-center gap-3 text-[11px] font-bold">
              <span class="flex items-center gap-1 text-emeraldPro-700">
                <span class="w-2.5 h-2.5 rounded-sm bg-emeraldPro-700 inline-block"></span> Ingresos
              </span>
              <span class="flex items-center gap-1 text-terra-600">
                <span class="w-2.5 h-2.5 rounded-sm bg-terra-500 inline-block"></span> Gastos
              </span>
              <span class="flex items-center gap-1 text-stoneInk-900">
                <span class="w-2.5 h-2.5 rounded-full bg-stoneInk-900 inline-block"></span> Acumulado
              </span>
            </div>
          </div>

          <div class="pt-1">
            ${comboChartSvg}
          </div>

          ${inspectedBannerHtml}
        </div>

        <!-- 3. Gráfico Donut / Tarta por Capítulos con selector de mes (Gtos Año y Por Mes) -->
        <div class="bg-white border border-cream-300 rounded-2xl p-4 shadow-sm space-y-3">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
            <div>
              <h3 class="font-extrabold text-sm text-stoneInk-900">Distribución por Capítulos</h3>
              <p class="text-[11px] text-stoneInk-500">${donutTitle}</p>
            </div>

            <div class="flex flex-wrap items-center gap-1.5">
              <div class="grid grid-cols-2 gap-1 bg-cream-200 p-1 rounded-xl text-[11px] font-extrabold">
                <button onclick="setChartDonutMode('year_expense')"
                  class="px-3 py-1.5 rounded-lg transition-all ${chartDonutMode !== 'month_expense' ? 'bg-white text-stoneInk-900 shadow-sm' : 'text-stoneInk-600'}">
                  Gtos Año
                </button>
                <button onclick="setChartDonutMode('month_expense')"
                  class="px-3 py-1.5 rounded-lg transition-all ${chartDonutMode === 'month_expense' ? 'bg-white text-stoneInk-900 shadow-sm' : 'text-stoneInk-600'}">
                  Por Mes
                </button>
              </div>

              ${chartDonutMode === 'month_expense' ? `
                <select onchange="setChartDonutMonth(this.value)"
                  class="bg-cream-100 border border-cream-300 rounded-xl px-2.5 py-1.5 text-xs font-extrabold text-stoneInk-900 focus:outline-none">
                  ${MONTHS_FULL.map((m, i) => `
                    <option value="${i}" ${i === chartDonutMonth ? 'selected' : ''}>${m}</option>
                  `).join('')}
                </select>
              ` : ''}
            </div>
          </div>

          ${donutHtml}
        </div>
      `;
    }

    // =========================================================================
    // 8. MODALES: REPARTO SUELDO MULTI-NÓMINA, NUEVO APUNTE SIN PRESELECCIÓN,
    //    CIERRE/ELIMINACIÓN DE CAPÍTULO CON HISTORIAL Y BLOQUES FILTRADOS
    // =========================================================================
    function openModal(html) {
      document.getElementById('modalSlot').innerHTML = `
        <div class="bg-cream-50 w-full max-w-lg rounded-t-3xl sm:rounded-3xl shadow-2xl border border-cream-300 pointer-events-auto animate-sheet max-h-[92vh] flex flex-col overflow-hidden">
          ${html}
        </div>
      `;
      document.getElementById('modalOverlay').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.add('hidden');
    }

    // --- A. MODAL REPARTIR SUELDO (MULTI-NÓMINA POR MES + PENDIENTE POR CAPÍTULO) ---
    function openSalarySplitModal() {
      const book = getActiveBook();
      const activeChapters = getSortedChapters(book.chapters).filter(c => !c.closed);

      if (activeChapters.length === 0) {
        showToast('No hay capítulos activos para repartir', 'error');
        return;
      }

      const defaultDate = `${book.year}-${String(selectedMonth + 1).padStart(2, '0')}-01`;

      openModal(`
        <div class="px-5 pt-4 pb-3 border-b border-cream-200 flex items-center justify-between bg-white">
          <div>
            <h3 class="font-extrabold text-base text-stoneInk-900">Repartir Sueldo</h3>
            <p class="text-[11px] text-stoneInk-500">Compatible con varias nóminas en el mismo mes</p>
          </div>
          <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-cream-200 flex items-center justify-center text-stoneInk-700">
            <i class="ph-bold ph-x"></i>
          </button>
        </div>

        <form onsubmit="submitSalarySplit(event)" class="p-5 space-y-4 overflow-y-auto">
          <div class="grid grid-cols-12 gap-2.5">
            <div class="col-span-5">
              <label class="block text-[11px] font-bold text-stoneInk-700 mb-1">Importe a repartir (€)</label>
              <input type="number" step="0.01" id="splitTotalInput" placeholder="0,00" oninput="recalcSplitTotals()"
                class="w-full bg-white border-2 border-emeraldPro-700 rounded-xl px-2.5 py-2 font-mono text-base font-extrabold text-stoneInk-900 focus:outline-none" />
            </div>
            <div class="col-span-4">
              <label class="block text-[11px] font-bold text-stoneInk-700 mb-1">Mes (${book.year})</label>
              <select id="splitMonthSelect" onchange="onSplitMonthChange()"
                class="w-full bg-white border border-cream-300 rounded-xl px-2.5 py-2.5 text-xs font-bold text-stoneInk-900 focus:outline-none">
                ${MONTHS_FULL.map((m, i) => `
                  <option value="${i}" ${i === selectedMonth ? 'selected' : ''}>${m}</option>
                `).join('')}
              </select>
            </div>
            <div class="col-span-3">
              <label class="block text-[11px] font-bold text-stoneInk-700 mb-1">Fecha</label>
              <input type="date" id="splitDateInput" value="${defaultDate}" required
                class="w-full bg-white border border-cream-300 rounded-xl px-2 py-2.5 text-[11px] font-bold text-stoneInk-900 focus:outline-none" />
            </div>
          </div>

          <div class="flex items-center justify-between gap-2">
            <span id="splitMonthAlreadyBanner" class="text-[11px] font-semibold text-stoneInk-600"></span>
            <button type="button" onclick="fillPendingQuotasSplit()"
              class="py-1.5 px-3 bg-emeraldPro-50 hover:bg-emeraldPro-100 text-emeraldPro-700 border border-emeraldPro-700/20 rounded-xl text-[11px] font-extrabold flex items-center gap-1.5 shrink-0">
              <i class="ph-bold ph-magic-wand"></i>
              <span>Rellenar pendiente</span>
            </button>
          </div>

          <!-- Lista dinámica por capítulo mostrando Cuota, Ya metido este mes y Pendiente -->
          <div id="splitChaptersRows" class="space-y-2 max-h-60 overflow-y-auto pr-1"></div>

          <div id="splitStatusBox" class="bg-stoneInk-900 text-white rounded-2xl p-3.5 flex items-center justify-between text-xs font-mono tabular-nums">
            <span>Repartido: <strong id="splitAssignedLabel">0,00 €</strong></span>
            <span id="splitDiffLabel" class="text-amber-300 font-bold">Introduce importe</span>
          </div>

          <button type="submit" id="splitConfirmBtn" disabled
            class="w-full py-3.5 rounded-2xl bg-emeraldPro-700 hover:bg-emeraldPro-600 text-white font-extrabold text-sm shadow-md transition-all opacity-40 cursor-not-allowed">
            Aceptar y Abonar en Capítulos
          </button>
        </form>
      `);

      renderSplitRowsForMonth(selectedMonth, true);
    }

    function onSplitMonthChange() {
      const mIdx = parseInt(document.getElementById('splitMonthSelect').value, 10);
      const book = getActiveBook();
      document.getElementById('splitDateInput').value = `${book.year}-${String(mIdx + 1).padStart(2, '0')}-01`;
      renderSplitRowsForMonth(mIdx, true);
    }

    function renderSplitRowsForMonth(mIdx, autoPrefill = false) {
      const book = getActiveBook();
      const { chapters } = analyzeBook(book, mIdx);
      const activeChapters = chapters.filter(c => !c.closed);
      const monthName = MONTHS_SHORT[mIdx];

      const totalAlreadyMonth = activeChapters.reduce((s, c) => s + c.monthSalaryIncome, 0);
      const totalPendingMonth = activeChapters.reduce((s, c) => s + Math.max(0, c.quota - c.monthSalaryIncome), 0);

      document.getElementById('splitMonthAlreadyBanner').innerHTML = totalAlreadyMonth > 0
        ? `Ya repartido en ${monthName}: <strong class="font-mono text-emeraldPro-700">${fmtEur(totalAlreadyMonth)}</strong>`
        : `Sin repartos previos en ${monthName}`;

      if (autoPrefill) {
        const totalInput = document.getElementById('splitTotalInput');
        if (totalPendingMonth > 0) {
          totalInput.value = totalPendingMonth.toFixed(2);
        } else {
          const sumQuotas = activeChapters.reduce((s, c) => s + c.quota, 0);
          totalInput.value = sumQuotas.toFixed(2);
        }
      }

      const container = document.getElementById('splitChaptersRows');
      container.innerHTML = activeChapters.map(ch => {
        const already = ch.monthSalaryIncome;
        const pending = Number(Math.max(0, ch.quota - already).toFixed(2));
        const initialVal = autoPrefill ? pending : 0;

        return `
          <div class="flex items-center justify-between gap-2.5 bg-white border border-cream-300 rounded-xl px-3 py-2.5">
            <div class="min-w-0">
              <div class="flex items-center gap-1.5">
                <p class="text-xs font-extrabold text-stoneInk-900 truncate">${esc(ch.name)}</p>
                ${pending <= 0.005 && ch.quota > 0
                  ? `<span class="text-[9px] font-extrabold bg-emeraldPro-100 text-emeraldPro-700 px-1.5 py-0.5 rounded">Completo</span>`
                  : ''
                }
              </div>
              <p class="text-[10px] text-stoneInk-500 mt-0.5 font-mono tabular-nums">
                Cuota: ${fmtEur(ch.quota)} · Metido: <strong class="text-emeraldPro-700">${fmtEur(already)}</strong> · Falta: <strong class="${pending > 0 ? 'text-terra-600' : 'text-stoneInk-500'}">${fmtEur(pending)}</strong>
              </p>
            </div>
            <div class="relative w-28 shrink-0">
              <input type="number" step="0.01" data-split-ch="${ch.id}" data-pending-quota="${pending}" data-base-quota="${ch.quota}"
                value="${initialVal.toFixed(2)}" oninput="recalcSplitTotals()"
                class="split-input w-full bg-cream-100 border border-cream-300 focus:border-emeraldPro-700 focus:bg-white rounded-lg pl-2.5 pr-6 py-1.5 text-right font-mono text-xs font-bold text-stoneInk-900 focus:outline-none" />
              <span class="absolute right-2 top-1/2 -translate-y-1/2 text-xs font-mono text-stoneInk-400">€</span>
            </div>
          </div>
        `;
      }).join('');

      recalcSplitTotals();
    }

    function fillPendingQuotasSplit() {
      const targetTotal = parseFloat(document.getElementById('splitTotalInput').value) || 0;
      const inputs = Array.from(document.querySelectorAll('.split-input'));
      const totalPending = inputs.reduce((s, inp) => s + (parseFloat(inp.dataset.pendingQuota) || 0), 0);

      if (targetTotal <= 0) {
        // Si el importe está vacío o 0, rellenamos lo pendiente exacto de cada capítulo
        inputs.forEach(inp => {
          inp.value = (parseFloat(inp.dataset.pendingQuota) || 0).toFixed(2);
        });
        document.getElementById('splitTotalInput').value = totalPending.toFixed(2);
        recalcSplitTotals();
        return;
      }

      // Si el usuario puso un sueldo parcial (ej. primera nómina del mes), cubrimos lo pendiente en orden o hasta agotar el importe
      let remaining = targetTotal;
      inputs.forEach(inp => {
        const pend = parseFloat(inp.dataset.pendingQuota) || 0;
        if (remaining <= 0 || pend <= 0) {
          inp.value = '0.00';
        } else if (remaining >= pend) {
          inp.value = pend.toFixed(2);
          remaining = Number((remaining - pend).toFixed(2));
        } else {
          inp.value = remaining.toFixed(2);
          remaining = 0;
        }
      });

      recalcSplitTotals();
    }

    function recalcSplitTotals() {
      const targetTotal = parseFloat(document.getElementById('splitTotalInput').value) || 0;
      const inputs = Array.from(document.querySelectorAll('.split-input'));
      const assigned = inputs.reduce((s, inp) => s + (parseFloat(inp.value) || 0), 0);
      const diff = Number((targetTotal - assigned).toFixed(2));

      document.getElementById('splitAssignedLabel').textContent = fmtEur(assigned);
      const diffEl = document.getElementById('splitDiffLabel');
      const btn = document.getElementById('splitConfirmBtn');

      if (targetTotal <= 0) {
        diffEl.textContent = 'Importe debe ser > 0';
        diffEl.className = 'text-rose-400 font-bold';
        btn.disabled = true;
        btn.classList.add('opacity-40', 'cursor-not-allowed');
        return;
      }

      if (Math.abs(diff) < 0.005) {
        diffEl.textContent = 'Cuadrado (100%)';
        diffEl.className = 'text-emerald-400 font-bold';
        btn.disabled = false;
        btn.classList.remove('opacity-40', 'cursor-not-allowed');
      } else if (diff > 0) {
        diffEl.textContent = `Faltan ${fmtEur(diff)}`;
        diffEl.className = 'text-amber-300 font-bold';
        btn.disabled = true;
        btn.classList.add('opacity-40', 'cursor-not-allowed');
      } else {
        diffEl.textContent = `Sobran ${fmtEur(Math.abs(diff))}`;
        diffEl.className = 'text-rose-400 font-bold';
        btn.disabled = true;
        btn.classList.add('opacity-40', 'cursor-not-allowed');
      }
    }

    function submitSalarySplit(e) {
      e.preventDefault();
      const targetTotal = parseFloat(document.getElementById('splitTotalInput').value) || 0;
      const inputs = Array.from(document.querySelectorAll('.split-input'));
      const assigned = inputs.reduce((s, inp) => s + (parseFloat(inp.value) || 0), 0);
      const diff = Number((targetTotal - assigned).toFixed(2));

      if (targetTotal <= 0 || Math.abs(diff) >= 0.005) {
        showToast(
          diff > 0
            ? `Faltan ${fmtEur(diff)} por repartir`
            : `Te has pasado por ${fmtEur(Math.abs(diff))}`,
          'error'
        );
        return;
      }

      const book = getActiveBook();
      const mIdx = parseInt(document.getElementById('splitMonthSelect').value, 10);
      const dateStr = document.getElementById('splitDateInput').value || `${book.year}-${String(mIdx + 1).padStart(2, '0')}-01`;

      let added = 0;
      inputs.forEach((inp, idx) => {
        const val = parseFloat(inp.value) || 0;
        if (Math.abs(val) > 0.001) {
          book.transactions.push({
            id: `tx_${Date.now()}_${idx}`,
            type: 'income',
            source: 'salary',
            chapterId: inp.dataset.splitCh,
            amount: Number(val.toFixed(2)),
            concept: `Reparto sueldo (${MONTHS_FULL[mIdx]})`,
            note: '',
            date: dateStr,
            month: mIdx
          });
          added++;
        }
      });

      if (added === 0) {
        showToast('Reparte al menos un importe mayor que 0', 'error');
        return;
      }

      selectedMonth = mIdx;
      saveState();
      closeModal();
      renderAll();
      showToast(`Sueldo repartido en ${added} capítulos`);
    }

    // --- B. MODAL NUEVO / EDITAR APUNTE (GASTO, INGRESO O TRASPASO ENTRE CAPÍTULOS) ---

      const book = getActiveBook();

      let conceptVal = '';
      let noteVal = '';

          initialMode = 'transfer';

          const outTx = pair.find(t => t.type === 'expense') || existing;
          const inTx = pair.find(t => t.type === 'income') || existing;
          fromChId = outTx.chapterId;
          toChId = inTx.chapterId;
          amtVal = outTx.amount;
          conceptVal = outTx.concept.replace(/^Traspaso a [^:]+:\s*/i, '');
          noteVal = outTx.note || '';
        } else {
          initialMode = existing.type;
          fromChId = existing.chapterId;
          amtVal = existing.amount;
          conceptVal = existing.concept;
          noteVal = existing.note || '';
        }

      const buildChapterOptions = (selectedId) => {

          : activeChapters;

          list.map(c => `
            <option value="${c.id}" ${c.id === selectedId ? 'selected' : ''}>

            </option>

      openModal(`

          <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-cream-200 flex items-center justify-center text-stoneInk-700">

                − Gasto
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="txMode" value="income" class="peer sr-only" onchange="toggleTxModeFields()" ${initialMode === 'income' ? 'checked' : ''} />
              <div class="py-2 text-center rounded-xl text-xs font-extrabold transition-all peer-checked:bg-emeraldPro-700 peer-checked:text-white text-stoneInk-700">

              </div>

    function toggleTxModeFields() {
      const mode = document.querySelector('input[name="txMode"]:checked')?.value || 'expense';
      const destGroup = document.getElementById('txDestChapterGroup');
      const destSelect = document.getElementById('txDestChapter');
      const label = document.getElementById('txChapterLabel');

      if (mode === 'transfer') {
        destGroup.classList.remove('hidden');
        destSelect.setAttribute('required', 'required');
        label.textContent = 'Capítulo de origen (sale dinero)';
      } else {
        destGroup.classList.add('hidden');
        destSelect.removeAttribute('required');
        label.textContent = 'Capítulo';
      }
    }

    function saveTransaction(e, txId) {
      e.preventDefault();
      const book = getActiveBook();
      const mode = document.querySelector('input[name="txMode"]:checked').value;
      const amount = parseFloat(document.getElementById('txAmount').value);
      const date = document.getElementById('txDate').value;
      const chapterId = document.getElementById('txChapter').value;
      const destChapterId = document.getElementById('txDestChapter')?.value || '';
      const concept = document.getElementById('txConcept').value.trim();
      const note = document.getElementById('txNote').value.trim();

      if (!chapterId) {
        showToast('Selecciona un capítulo', 'error');
        return;
      }
      if (isNaN(amount) || amount === 0) {
        showToast('Introduce un importe distinto de 0', 'error');
        return;
      }
      if (mode === 'transfer') {
        if (!destChapterId) {
          showToast('Selecciona el capítulo de destino', 'error');
          return;
        }
        if (chapterId === destChapterId) {
          showToast('El origen y el destino deben ser distintos', 'error');
          return;
        }
      }

      const monthIdx = date && date.length >= 7
        ? Math.max(0, Math.min(11, parseInt(date.split('-')[1], 10) - 1))
        : selectedMonth;

      // Si estamos editando, eliminamos el apunte o pareja de traspaso anterior antes de grabar el nuevo
      if (txId) {
        const prev = book.transactions.find(t => t.id === txId);
        if (prev && prev.transferId) {
          book.transactions = book.transactions.filter(t => t.transferId !== prev.transferId);
        } else {
          book.transactions = book.transactions.filter(t => t.id !== txId);
        }
      }

      if (mode === 'transfer') {
        const fromCh = book.chapters.find(c => c.id === chapterId);
        const toCh = book.chapters.find(c => c.id === destChapterId);
        const trId = 'tr_' + Date.now();
        const absAmt = Number(Math.abs(amount).toFixed(2));

        book.transactions.push({
          id: `${trId}_out`,
          transferId: trId,
          type: 'expense',
          chapterId,
          amount: absAmt,
          concept: `Traspaso a ${toCh ? toCh.name : 'destino'}: ${concept}`,
          note,
          date,
          month: monthIdx
        });

        book.transactions.push({
          id: `${trId}_in`,
          transferId: trId,
          type: 'income',
          source: 'transfer',
          chapterId: destChapterId,
          amount: absAmt,
          concept: `Traspaso desde ${fromCh ? fromCh.name : 'origen'}: ${concept}`,
          note,
          date,
          month: monthIdx
        });
      } else {
        book.transactions.push({
          id: txId || ('tx_' + Date.now()),
          type: mode,
          source: mode === 'income' ? 'extra' : undefined,
          chapterId,
          amount: Number(amount.toFixed(2)),
          concept,
          note,
          date,
          month: monthIdx
        });
      }

      saveState();
      closeModal();
      renderAll();
      showToast(
        txId
          ? 'Apunte actualizado'
          : mode === 'transfer'
            ? 'Traspaso realizado entre capítulos'
            : mode === 'income'
              ? 'Ingreso guardado'
              : 'Gasto guardado'
      );
    }

    function deleteTransaction(txId) {
      const book = getActiveBook();
      const target = book.transactions.find(t => t.id === txId);
      if (target && target.transferId) {
        book.transactions = book.transactions.filter(t => t.transferId !== target.transferId);
      } else {
        book.transactions = book.transactions.filter(t => t.id !== txId);
      }
      saveState();
      closeModal();
      renderAll();
      showToast('Apunte eliminado');
    }

          <div>

                  + Nuevo aquí
                </button>
              ` : ''}

          ${!ch.closed ? `

                <i class="ph-bold ph-trash text-base"></i>
                <span>Eliminar capítulo</span>
              </button>

    }

    /**
     * Regla de eliminación de capítulo:
     * - Si tiene saldo != 0,00 € -> obliga a traspasar ese saldo a otro capítulo activo en la fecha de cierre.
     * - El capítulo pasa a estado `closed: true` con `closedDate` y `closedMonth`, conservando sus datos históricos
     *   en gris hasta la fecha de cierre sin descuadrar los meses pasados.
     * - Si tiene saldo 0,00 € y 0 apuntes -> borrado limpio directo.
     */
    function initiateDeleteChapter(chapterId) {
      const book = getActiveBook();
      const { chapters } = analyzeBook(book, 11);
      const ch = chapters.find(c => c.id === chapterId);
      if (!ch) return;

      const chTxs = book.transactions.filter(t => t.chapterId === chapterId);
      const otherActiveChapters = chapters.filter(c => c.id !== chapterId && !c.closed);
      const hasBalance = Math.abs(ch.annualEndBalance) >= 0.005;

      const today = new Date();
      const defaultDate = today.getFullYear() === book.year
        ? today.toISOString().slice(0, 10)
        : `${book.year}-${String(selectedMonth + 1).padStart(2, '0')}-28`;

      // Si saldo es 0,00 € y no tiene apuntes -> borrado definitivo limpio
      if (!hasBalance && chTxs.length === 0) {
        openModal(`
          <div class="px-5 pt-4 pb-3 border-b border-cream-200 flex items-center justify-between bg-white">

    function confirmDirectDeleteEmptyChapter(chapterId) {
      const book = getActiveBook();
      const ch = book.chapters.find(c => c.id === chapterId);
      if (!ch) return;
      book.chapters = book.chapters.filter(c => c.id !== chapterId);
      if (chronoFilter.chapterId === chapterId) chronoFilter.chapterId = 'all';
      saveState();
      closeModal();
      renderAll();
      showToast(`Capítulo "${ch.name}" eliminado`);
    }

    function closeZeroBalanceChapter(e, chapterId) {
      e.preventDefault();
      const book = getActiveBook();
      const ch = book.chapters.find(c => c.id === chapterId);
      if (!ch) return;
      const date = document.getElementById('zeroCloseDate').value;
      const monthIdx = date && date.length >= 7
        ? Math.max(0, Math.min(11, parseInt(date.split('-')[1], 10) - 1))
        : selectedMonth;

      ch.closed = true;
      ch.closedDate = date;
      ch.closedMonth = monthIdx;
      ch.quota = 0;

      saveState();
      closeModal();
      renderAll();
      showToast(`Capítulo "${ch.name}" cerrado`);
    }

    function executeTransferAndCloseChapter(e, chapterId) {
      e.preventDefault();
      const book = getActiveBook();
      const { chapters } = analyzeBook(book, 11);
      const sourceCh = chapters.find(c => c.id === chapterId);
      const targetId = document.getElementById('delTransferTargetCh').value;
      if (!targetId) {
        showToast('Selecciona un capítulo de destino', 'error');
        return;
      }
      const targetCh = book.chapters.find(c => c.id === targetId);
      const date = document.getElementById('delTransferDate').value;
      const concept = document.getElementById('delTransferConcept').value.trim();

      if (!sourceCh || !targetCh) return;

      const monthIdx = date && date.length >= 7
        ? Math.max(0, Math.min(11, parseInt(date.split('-')[1], 10) - 1))
        : selectedMonth;

      const bal = sourceCh.annualEndBalance;
      const trId = 'tr_close_' + Date.now();

      // Si el saldo es positivo: salida del capítulo cerrado -> entrada en destino
      // Si el saldo es negativo (deuda): entrada en capítulo cerrado -> salida del destino para cubrirlo
      if (bal > 0) {
        book.transactions.push({
          id: `${trId}_out`,
          transferId: trId,
          type: 'expense',
          chapterId: sourceCh.id,
          amount: Number(bal.toFixed(2)),
          concept: `Traspaso a ${targetCh.name}: ${concept}`,
          note: 'Cierre de capítulo',
          date,
          month: monthIdx
        });
        book.transactions.push({
          id: `${trId}_in`,
          transferId: trId,
          type: 'income',
          source: 'transfer',
          chapterId: targetCh.id,
          amount: Number(bal.toFixed(2)),
          concept: `Traspaso desde ${sourceCh.name}: ${concept}`,
          note: 'Cierre de capítulo',
          date,
          month: monthIdx
        });
      } else if (bal < 0) {
        const absBal = Number(Math.abs(bal).toFixed(2));
        book.transactions.push({
          id: `${trId}_in`,
          transferId: trId,
          type: 'income',
          source: 'transfer',
          chapterId: sourceCh.id,
          amount: absBal,
          concept: `Liquidación desde ${targetCh.name}: ${concept}`,
          note: 'Cierre de capítulo',
          date,
          month: monthIdx
        });
        book.transactions.push({
          id: `${trId}_out`,
          transferId: trId,
          type: 'expense',
          chapterId: targetCh.id,
          amount: absBal,
          concept: `Cobertura cierre ${sourceCh.name}: ${concept}`,
          note: 'Cierre de capítulo',
          date,
          month: monthIdx
        });
      }

      // Marcar el capítulo como cerrado/eliminado conservando todo su historial en gris
      const rawCh = book.chapters.find(c => c.id === sourceCh.id);
      if (rawCh) {
        rawCh.closed = true;
        rawCh.closedDate = date;
        rawCh.closedMonth = monthIdx;
        rawCh.quota = 0;
      }

      saveState();
      closeModal();
      renderAll();
      showToast(`Traspasados ${fmtEur(bal)} a "${targetCh.name}" y cerrado "${sourceCh.name}"`);
    }

                  class="w-full bg-white border border-cream-300 rounded-xl px-3 py-2 font-mono text-xs font-bold" />
              </div>
            </div>

            <div>
              <label class="block text-[10px] font-bold text-stoneInk-600 mb-1">Copiar capítulos y saldos finales de:</label>
              <select id="copyFromBookSelect" onchange="updateCopyPreview()"
                class="w-full bg-white border border-cream-300 rounded-xl px-3 py-2 text-xs font-bold text-stoneInk-900">
              </select>
            </div>

            <div id="copyPreviewBox" class="bg-white/90 rounded-xl p-2.5 text-[11px] text-stoneInk-600 max-h-28 overflow-y-auto space-y-1"></div>

            <button type="submit" class="w-full py-3 rounded-xl bg-stoneInk-900 text-white text-xs font-extrabold">
              + Crear Año
            </button>
          </form>
        </div>
      `);

      refreshCopySourceOptions();
    }

    /**
     * Filtra estrictamente el desplegable de origen para mostrar SOLO los años del bloque seleccionado.
     */
    function refreshCopySourceOptions() {
      const selectedCat = document.getElementById('newYearCategory').value;
      const catBooks = getBooksByCategory(selectedCat);
      const selectEl = document.getElementById('copyFromBookSelect');
      const yearInput = document.getElementById('newYearNumber');

      if (catBooks.length > 0) {
        yearInput.value = catBooks[0].year + 1;
      }

      const catLabel = selectedCat === 'personal' ? 'Personal' : 'Hogar';
      selectEl.innerHTML = catBooks.map((b, idx) => `
        <option value="${b.id}" ${idx === 0 ? 'selected' : ''}>
          ${catLabel} · ${b.year} (${b.chapters.filter(c => !c.closed).length} cap. activos)
        </option>
      `).join('') + `<option value="blank">Empezar vacío (0 capítulos)</option>`;

      updateCopyPreview();
    }

    function switchCategory(cat) {
      state.activeCategory = cat;
      const list = getBooksByCategory(cat);
      if (list.length > 0) {
        state.activeBookId = list[0].id;
      }
      chronoFilter.chapterId = 'all';
      saveState();
      closeModal();
      renderAll();
    }

    function updateCopyPreview() {
      const srcId = document.getElementById('copyFromBookSelect').value;
      const box = document.getElementById('copyPreviewBox');
      if (srcId === 'blank') {
        box.innerHTML = `<span class="text-stoneInk-500">Se creará un libro vacío listo para añadir capítulos.</span>`;
        return;
      }
      const srcBook = state.books.find(b => b.id === srcId);
      if (!srcBook) return;
      const { chapters } = analyzeBook(srcBook, 11);
      const activeChapters = chapters.filter(c => !c.closed);
      if (activeChapters.length === 0) {
        box.innerHTML = `<span class="text-stoneInk-500">El libro seleccionado aún no tiene capítulos activos.</span>`;
        return;
      }
      box.innerHTML = `
        <p class="font-bold text-stoneInk-800 mb-1">Capítulos activos y saldos finales que heredará:</p>
        ${activeChapters.map(c => `
          <div class="flex justify-between font-mono text-[11px]">
            <span class="font-sans text-stoneInk-700">${esc(c.name)} (cuota ${fmtEur(c.quota)})</span>
            <strong class="${c.annualEndBalance < 0 ? 'text-terra-600' : 'text-emeraldPro-700'}">${fmtEur(c.annualEndBalance)}</strong>
          </div>
        `).join('')}
      `;
    }

    function createNewYearBook(e) {
      e.preventDefault();
      const cat = document.getElementById('newYearCategory').value;
      const year = parseInt(document.getElementById('newYearNumber').value, 10) || 2027;
      const srcId = document.getElementById('copyFromBookSelect').value;

      const exists = state.books.find(b => b.category === cat && b.year === year);
      if (exists) {
        showToast(`Ya existe ${cat === 'personal' ? 'Personal' : 'Hogar'} ${year}`, 'error');
        return;
      }

      let chapters = [];
      if (srcId !== 'blank') {
        const srcBook = state.books.find(b => b.id === srcId && b.category === cat);
        if (srcBook) {
          const { chapters: analyzed } = analyzeBook(srcBook, 11);
          chapters = analyzed
            .filter(c => !c.closed)
            .map((c, idx) => ({
              id: `ch_${cat}_${year}_${Date.now()}_${idx}`,
              name: c.name,
              initialBalance: c.annualEndBalance,
              quota: c.quota
            }));
        }
      }

      const newId = `${cat}_${year}_${Date.now()}`;
      state.books.push({
        id: newId,
        category: cat,
        year,
        chapters,
        transactions: []
      });
      state.activeCategory = cat;
      state.activeBookId = newId;
      saveState();
      closeModal();
      renderAll();
      showToast(`Creado ${cat === 'personal' ? 'Personal' : 'Hogar'} ${year}`);
    }

    // --- G. AJUSTES, COPIA DE SEGURIDAD Y RESTAURACIÓN ---
    function openSettingsModal() {
      openModal(`
        <div class="px-5 pt-4 pb-3 border-b border-cream-200 flex items-center justify-between bg-white">
          <h3 class="font-extrabold text-base text-stoneInk-900">Ajustes y Copia de Seguridad</h3>
          <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-cream-200 flex items-center justify-center text-stoneInk-700">
            <i class="ph-bold ph-x"></i>
          </button>
        </div>

        <div class="p-5 overflow-y-auto space-y-4">
          <div class="bg-emeraldPro-50 border border-emeraldPro-700/20 rounded-2xl p-3.5">
            <p class="text-xs font-extrabold text-emeraldPro-700 mb-1 flex items-center gap-1.5">
              <i class="ph-bold ph-device-mobile text-base"></i>
              <span>Instalar en tu móvil (PWA)</span>
            </p>
            <p class="text-xs text-stoneInk-700 leading-relaxed">
              <strong>iPhone (Safari):</strong> Pulsa <em>Compartir</em> y elige <strong>"Añadir a pantalla de inicio"</strong>.<br/>
              <strong>Android (Chrome):</strong> Pulsa el menú <em>⋮</em> y elige <strong>"Instalar aplicación"</strong>.
            </p>
          </div>

          <div class="space-y-2">
            <button onclick="exportBookCSV()"
              class="w-full py-3 px-4 bg-white hover:bg-cream-50 border border-cream-300 rounded-2xl flex items-center justify-between text-xs font-extrabold text-stoneInk-900">
              <span class="flex items-center gap-2">
                <i class="ph-bold ph-file-xls text-lg text-emeraldPro-700"></i>
                Exportar año actual a Excel (CSV)
              </span>
              <i class="ph-bold ph-download-simple"></i>
            </button>

            <button onclick="exportFullJSON()"
              class="w-full py-3 px-4 bg-white hover:bg-cream-50 border border-cream-300 rounded-2xl flex items-center justify-between text-xs font-extrabold text-stoneInk-900">
              <span class="flex items-center gap-2">
                <i class="ph-bold ph-floppy-disk text-lg text-sky-700"></i>
                Descargar Copia de Seguridad completa (JSON)
              </span>
              <i class="ph-bold ph-download-simple"></i>
            </button>

            <label class="w-full py-3 px-4 bg-white hover:bg-cream-50 border border-dashed border-stoneInk-400 rounded-2xl flex items-center justify-center gap-2 text-xs font-extrabold text-stoneInk-700 cursor-pointer">
              <i class="ph-bold ph-upload-simple text-base"></i>
              <span>Restaurar copia desde JSON</span>
              <input type="file" accept=".json" onchange="importFullJSON(event)" class="hidden" />
            </label>
          </div>

          <div class="pt-2 border-t border-cream-200">
            <button onclick="restoreExcelDefault()"
              class="w-full py-2.5 text-xs font-extrabold text-terra-600 hover:bg-terra-50 rounded-xl transition-colors">
              Restaurar datos originales del Excel (2019–2026)
            </button>
          </div>
        </div>
      `);
    }

    function exportBookCSV() {
      const book = getActiveBook();
      const chMap = Object.fromEntries(book.chapters.map(c => [c.id, c.name]));
      const rows = [['Bloque', 'Año', 'Fecha', 'Mes', 'Capitulo', 'Tipo', 'Importe', 'Concepto', 'Nota']];
      const catLabel = book.category === 'personal' ? 'Personal' : 'Hogar';

      book.transactions.slice().sort((a, b) => (a.date || '').localeCompare(b.date || '')).forEach(t => {
        rows.push([
          catLabel,
          book.year,
          t.date,
          MONTHS_FULL[getTxMonth(t)],
          `"${(chMap[t.chapterId] || '').replace(/"/g, '""')}"`,
          t.transferId ? 'Traspaso' : (t.type === 'income' ? 'Ingreso' : 'Gasto'),
          String(t.amount).replace('.', ','),
          `"${(t.concept || '').replace(/"/g, '""')}"`,
          `"${(t.note || '').replace(/"/g, '""')}"`
        ]);
      });

      const csv = '\uFEFF' + rows.map(r => r.join(';')).join('\n');
      triggerDownload(csv, `${catLabel}_${book.year}.csv`, 'text/csv;charset=utf-8;');
      showToast('CSV descargado');
    }

    function exportFullJSON() {
      triggerDownload(JSON.stringify(state, null, 2), `MisSobres_2019_2026_${new Date().toISOString().slice(0, 10)}.json`, 'application/json');
      showToast('Copia JSON descargada');
    }

    function importFullJSON(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        try {
          const parsed = JSON.parse(ev.target.result);
          if (parsed && Array.isArray(parsed.books)) {
            state = parsed;
            saveState();
            closeModal();
            renderAll();
            showToast('Copia restaurada');
          } else {
            showToast('Archivo JSON inválido', 'error');
          }
        } catch {
          showToast('Error al leer JSON', 'error');
        }
      };
      reader.readAsText(file);
    }

    function restoreExcelDefault() {
      state = buildInitialState();
      saveState();
      closeModal();
      renderAll();
      showToast('Datos originales 2019–2026 restaurados');
    }

    function triggerDownload(content, filename, mime) {
      const blob = new Blob([content], { type: mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // =========================================================================
    // 9. UTILIDADES UI
    // =========================================================================
    function showToast(msg, type = 'ok') {
      const box = document.getElementById('toastBox');
      const el = document.createElement('div');
      el.className = `px-4 py-2.5 rounded-2xl shadow-lg text-xs font-extrabold flex items-center gap-2 animate-fade ${
        type === 'error' ? 'bg-terra-600 text-white' : 'bg-stoneInk-900 text-white'
      }`;
      el.innerHTML = `<i class="ph-bold ${type === 'error' ? 'ph-warning-circle' : 'ph-check-circle'} text-base"></i><span>${esc(msg)}</span>`;
      box.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transition = 'opacity 0.2s';
        setTimeout(() => el.remove(), 220);
      }, 2400);
    }

    function esc(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    window.addEventListener('DOMContentLoaded', () => {
      initChronoListeners();
      renderAll();
    });
  </script>
</body>
